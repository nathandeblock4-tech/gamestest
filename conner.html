<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Nights at Conner's</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #9a9a9a; font-family: 'VT323', monospace; min-height: 100vh; padding: 12px; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 18px; flex-wrap: wrap; }
  .bar a { color: #ddd; background: #1b1b1b; border: 1px solid #333; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-size: 20px; }
  .bar a:focus-visible { outline: 2px solid #c33; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border: 1px solid #1a1a1a; touch-action: none; cursor: pointer; }
  .keys { margin-top: 10px; font-size: 18px; text-align: center; color: #666; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a href="index.html">← Back</a>
    <span>Turn your sound up. Turn the lights off. Phones: play sideways.</span>
  </div>
  <div style="position:relative">
    <canvas id="c" width="1280" height="720"></canvas>
    <div id="lock" style="position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px">
      <div style="font-family:'Special Elite',serif;font-size:clamp(28px,5vw,58px);color:#ddd;line-height:1">FIVE NIGHTS<br><span style="color:#b01818">AT CONNER'S</span></div>
      <div style="font-size:22px;color:#888">🔒 This game is locked. Enter the password.</div>
      <form id="lockForm" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <input id="pw" type="password" autocomplete="off" placeholder="Password" style="background:#111;border:1px solid #444;color:#eee;font:24px VT323,monospace;padding:8px 14px;border-radius:8px;width:240px">
        <button style="background:#7a1010;color:#fff;border:none;font:24px VT323,monospace;padding:8px 18px;border-radius:8px;cursor:pointer">Unlock</button>
      </form>
      <div id="lockMsg" style="font-size:22px;color:#c33;min-height:26px"></div>
    </div>
  </div>
  <p class="keys">Q / E: left / right door &nbsp;·&nbsp; A / D: left / right light &nbsp;·&nbsp; Space: cameras &nbsp;·&nbsp; 1–8: switch camera</p>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 1280, H = 720;
  const rnd = (a, b) => a + Math.random() * (b - a);
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // ================= THE FACE (photo if uploaded, drawn fallback otherwise) =================
  const photo = new Image();
  let photoOK = false;
  const photo2 = new Image();
  photo.onload = () => { photoOK = true; };
  // ---- password lock: the face is stored encrypted; the password decrypts it ----
  let locked = true;
  async function loadSecond(pw) {
    try {
      const raw2 = new Uint8Array(await (await fetch('conner2.bin', { cache: 'no-store' })).arrayBuffer());
      const base2 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key2 = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: raw2.slice(0, 16), iterations: 200000, hash: 'SHA-256' }, base2, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain2 = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw2.slice(16, 28) }, key2, raw2.slice(28));
      photo2.src = URL.createObjectURL(new Blob([plain2], { type: 'image/jpeg' }));
    } catch (e2) {}
  }
  async function unlock(pw) {
    const raw = new Uint8Array(await (await fetch('conner_scary.bin', { cache: 'no-store' })).arrayBuffer());
    const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    photo.src = URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' }));
    await new Promise((res, rej) => { photo.onload = () => { photoOK = true; res(); }; photo.onerror = rej; });
    locked = false; document.getElementById('lock').style.display = 'none';
    loadSecond(pw);
  }
  async function tryPw(pw, remember) {
    const msg = document.getElementById('lockMsg'); msg.style.color = '#888'; msg.textContent = 'Checking...';
    try { await unlock(pw); if (remember) save('fnac_pw', pw); }
    catch (e) { msg.style.color = '#c33'; msg.textContent = location.protocol === 'file:' ? 'Open this from the website to unlock.' : 'Wrong password.'; try { localStorage.removeItem('fnac_pw'); } catch (er) {} }
  }
  document.getElementById('lockForm').addEventListener('submit', e => { e.preventDefault(); tryPw(document.getElementById('pw').value, true); });
  if (load('fnac_pw')) tryPw(load('fnac_pw'), false); else setTimeout(() => document.getElementById('pw').focus(), 100);

  function drawFaceArt(g, cx, cy, r) {
    g.save();
    g.fillStyle = '#6e3410';
    for (let i = 0; i < 70; i++) {
      const a = i / 70 * Math.PI * 2;
      g.beginPath();
      g.ellipse(cx + Math.cos(a) * r * 0.82, cy + Math.sin(a) * r * 0.88 - r * 0.1, r * 0.34, r * 0.16, a, 0, Math.PI * 2);
      g.fill();
    }
    const fur = g.createRadialGradient(cx, cy - r * 0.2, r * 0.2, cx, cy, r * 1.2);
    fur.addColorStop(0, '#b5652a'); fur.addColorStop(1, '#4a220a');
    g.fillStyle = fur; g.beginPath(); g.ellipse(cx, cy - r * 0.1, r, r * 1.1, 0, 0, Math.PI * 2); g.fill();
    const sk = g.createRadialGradient(cx, cy, r * 0.1, cx, cy + r * 0.1, r * 0.9);
    sk.addColorStop(0, '#cdb8aa'); sk.addColorStop(0.7, '#8f7a70'); sk.addColorStop(1, '#4f3e38');
    g.fillStyle = sk; g.beginPath(); g.ellipse(cx, cy + r * 0.1, r * 0.78, r * 0.86, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(55,35,30,.55)'; g.lineWidth = r * 0.015;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(cx, cy - r * 0.22 - i * r * 0.07, r * 0.38, Math.PI * 1.2, Math.PI * 1.8); g.stroke(); }
    [-1, 1].forEach(s => {
      const ex = cx + s * r * 0.3, ey = cy - r * 0.02;
      g.fillStyle = '#3c2a24'; g.beginPath(); g.ellipse(ex, ey, r * 0.25, r * 0.28, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#efe6d6'; g.beginPath(); g.ellipse(ex, ey, r * 0.2, r * 0.22, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#2a1a10'; g.beginPath(); g.arc(ex, ey + r * 0.02, r * 0.1, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#000'; g.beginPath(); g.arc(ex, ey + r * 0.02, r * 0.055, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(ex + r * 0.035, ey - r * 0.03, r * 0.022, 0, Math.PI * 2); g.fill();
    });
    g.fillStyle = '#2e1e19';
    [-1, 1].forEach(s => { g.beginPath(); g.ellipse(cx + s * r * 0.075, cy + r * 0.3, r * 0.05, r * 0.03, s * 0.4, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = '#5a3c34'; g.beginPath(); g.ellipse(cx, cy + r * 0.6, r * 0.36, r * 0.3, 0, 0, Math.PI * 2); g.fill();
    const mg = g.createRadialGradient(cx, cy + r * 0.62, r * 0.03, cx, cy + r * 0.6, r * 0.3);
    mg.addColorStop(0, '#0d0202'); mg.addColorStop(1, '#4a1212');
    g.fillStyle = mg; g.beginPath(); g.ellipse(cx, cy + r * 0.6, r * 0.29, r * 0.24, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#d6c6a4'; g.beginPath(); g.ellipse(cx, cy + r * 0.4, r * 0.18, r * 0.045, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#b05656'; g.beginPath(); g.ellipse(cx, cy + r * 0.74, r * 0.15, r * 0.07, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  // pre-render the drawn face once
  const faceArt = document.createElement('canvas'); faceArt.width = faceArt.height = 512;
  drawFaceArt(faceArt.getContext('2d'), 256, 250, 200);
  const ART_EYES = [[0.383, 0.484], [0.617, 0.484]];
  const PHOTO_EYES = [[0.233, 0.527], [0.524, 0.598]];

  // draws the head centered at cx,cy with width w; returns the eye positions
  function drawHead(g, cx, cy, w, filter) {
    const h = w * 1.18;
    g.save();
    if (filter) g.filter = filter;
    let eyes;
    if (photoOK) {
      g.beginPath(); g.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2); g.clip();
      const ar = photo.width / photo.height;
      let dw = w * 1.1, dh = dw / ar;
      if (dh < h * 1.1) { dh = h * 1.1; dw = dh * ar; }
      const x0 = cx - dw / 2, y0 = cy - dh / 2;
      g.drawImage(photo, x0, y0, dw, dh);
      eyes = PHOTO_EYES.map(([ex, ey]) => [x0 + ex * dw, y0 + ey * dh]);
    } else {
      const s = w * 1.3;
      g.drawImage(faceArt, cx - s / 2, cy - s * 0.49, s, s);
      eyes = ART_EYES.map(([ex, ey]) => [cx - s / 2 + ex * s, cy - s * 0.49 + ey * s]);
    }
    g.restore();
    return eyes;
  }
  const hair = Array.from({ length: 90 }, () => [Math.random() * 2 - 1, Math.random(), Math.random() * 0.4 + 0.2]);
  // a whole Conner: blue shirt with the face on top
  function drawDem(g, hx, hy, hs, o) {
    o = o || {};
    g.save();
    g.fillStyle = o.body || '#1d5fc4';
    g.beginPath(); g.ellipse(hx, hy + hs * 1.05, hs * 1.25, hs * 0.65, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(hx, hy + hs * 1.9, hs * 0.95, hs * 1.1, 0, 0, Math.PI * 2); g.fill();
    g.lineCap = 'round'; g.strokeStyle = o.body || '#1d5fc4'; g.lineWidth = hs * 0.38;
    [-1, 1].forEach(s => { g.beginPath(); g.moveTo(hx + s * hs * 1.0, hy + hs * 1.0); g.quadraticCurveTo(hx + s * hs * 1.55, hy + hs * 2.0, hx + s * hs * 1.3, hy + hs * 3.0); g.stroke(); });
    g.strokeStyle = o.hair || '#174a9a'; g.lineWidth = Math.max(1, hs * 0.03);
    hair.forEach(([x, y, l]) => { const px = hx + x * hs * 1.2, py = hy + hs * (0.8 + y * 2.2); g.beginPath(); g.moveTo(px, py); g.lineTo(px + x * hs * 0.15, py + l * hs * 0.5); g.stroke(); });
    g.restore();
    const eyes = drawHead(g, hx, hy, hs, o.filter);
    if (o.glow) glowEyes(g, eyes, hs * 0.09, o.glow);
    return eyes;
  }
  function glowEyes(g, eyes, r, a) {
    g.save(); g.globalCompositeOperation = 'lighter';
    eyes.forEach(([x, y]) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r * 4);
      gr.addColorStop(0, 'rgba(255,255,230,' + a + ')'); gr.addColorStop(0.25, 'rgba(255,230,160,' + a * 0.6 + ')'); gr.addColorStop(1, 'rgba(255,200,120,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 4, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,' + a + ')'; g.beginPath(); g.arc(x, y, r * 0.6, 0, Math.PI * 2); g.fill();
    });
    g.restore();
  }

  // ================= AUDIO (all synthesized) =================
  let ac = null, master = null, noiseBuf = null;
  function A() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noiseSrc() {
    if (!noiseBuf) { const len = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, len, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
  }
  function out(node, pan) {
    if (pan !== undefined && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(master); }
    else node.connect(master);
  }
  function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function thump(pan, vol) {
    if (!A()) return; const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.25);
    env(g, t, 0.01, vol, 0.3); o.connect(g); out(g, pan); o.start(t); o.stop(t + 0.4);
    const n = noiseSrc(), f = ac.createBiquadFilter(), ng = ac.createGain();
    f.type = 'lowpass'; f.frequency.value = 320; env(ng, t, 0.005, vol * 0.6, 0.15);
    n.connect(f); f.connect(ng); out(ng, pan); n.start(t); n.stop(t + 0.3);
  }
  function footsteps(pan, vol) { for (let i = 0; i < 3; i++) setTimeout(() => thump(pan, vol), i * 420); }
  function slam(pan) {
    if (!A()) return; const t = ac.currentTime;
    const n = noiseSrc(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.7; env(g, t, 0.005, 0.6, 0.35);
    n.connect(f); f.connect(g); out(g, pan); n.start(t); n.stop(t + 0.5); thump(pan, 0.8);
  }
  function knock(pan) { for (let i = 0; i < 3; i++) setTimeout(() => { thump(pan, 1); slam(pan); }, i * 260); }
  function blip() {
    if (!A()) return; const t = ac.currentTime; const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1400; env(g, t, 0.005, 0.06, 0.06); o.connect(g); out(g); o.start(t); o.stop(t + 0.1);
  }
  function staticBurst(dur, vol) {
    if (!A()) return; const t = ac.currentTime; const n = noiseSrc(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'highpass'; f.frequency.value = 1500; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); out(g); n.start(t); n.stop(t + dur + 0.05);
  }
  function sting() {
    if (!A()) return; const t = ac.currentTime;
    [233, 247, 349, 370].forEach(fq => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.value = fq; env(g, t, 0.01, 0.1, 1.2); o.connect(g); out(g); o.start(t); o.stop(t + 1.3); });
    staticBurst(0.6, 0.3);
  }
  function growl() {
    if (!A()) return; const t = ac.currentTime;
    [55, 58, 82].forEach((fq, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(fq, t); o.frequency.linearRampToValueAtTime(fq * 0.7, t + 2.2); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.3); o.connect(g); out(g); o.start(t); o.stop(t + 2.4); });
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(28, t + 0.6); g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7); o.connect(g); out(g); o.start(t); o.stop(t + 0.8);
  }
  function scream(delay) {
    if (!A()) return; const t = ac.currentTime + (delay || 0);
    const shaper = ac.createWaveShaper(); const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 6); }
    shaper.curve = curve;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 0.02); g.gain.setValueAtTime(1, t + 1.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    shaper.connect(g); out(g);
    [310, 333, 470, 620, 905].forEach((fq, i) => {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(fq * 0.6, t); o.frequency.exponentialRampToValueAtTime(fq * 1.5, t + 0.2); o.frequency.exponentialRampToValueAtTime(fq * 0.9, t + 1.6);
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 9 + i * 3; lg.gain.value = fq * 0.09; l.connect(lg); lg.connect(o.frequency);
      const og = ac.createGain(); og.gain.value = 0.22; o.connect(og); og.connect(shaper);
      o.start(t); l.start(t); o.stop(t + 1.8); l.stop(t + 1.8);
    });
    const n = noiseSrc(), ng = ac.createGain(); ng.gain.value = 0.5; n.connect(ng); ng.connect(shaper); n.start(t); n.stop(t + 1.8);
  }
  function chime() {
    if (!A()) return; const t = ac.currentTime;
    [523, 659, 784, 1047, 784, 1047].forEach((fq, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = fq; env(g, t + i * 0.35, 0.01, 0.25, 1.4); o.connect(g); out(g); o.start(t + i * 0.35); o.stop(t + i * 0.35 + 1.6); });
  }
  function powerDown() {
    if (!A()) return; const t = ac.currentTime; const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(30, t + 1.5);
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6); o.connect(g); out(g); o.start(t); o.stop(t + 1.7);
  }
  function ring() {
    if (!A()) return; const t = ac.currentTime;
    for (let k = 0; k < 2; k++) [440, 480].forEach(fq => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = fq; g.gain.setValueAtTime(0.0001, t + k * 1.2); g.gain.exponentialRampToValueAtTime(0.08, t + k * 1.2 + 0.02); g.gain.setValueAtTime(0.08, t + k * 1.2 + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + k * 1.2 + 0.75); o.connect(g); out(g); o.start(t + k * 1.2); o.stop(t + k * 1.2 + 0.8); });
  }
  let amb = null;
  function startAmb() {
    if (!A() || amb) return; const t = ac.currentTime;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(1, t + 2); out(g);
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.frequency.value = 55; o2.frequency.value = 58.3;
    const og = ac.createGain(); og.gain.value = 0.07; o1.connect(og); o2.connect(og); og.connect(g);
    const n = noiseSrc(), f = ac.createBiquadFilter(), ng = ac.createGain(); f.type = 'bandpass'; f.frequency.value = 170; f.Q.value = 1.5; ng.gain.value = 0.06;
    n.connect(f); f.connect(ng); ng.connect(g);
    o1.start(); o2.start(); n.start();
    amb = { g, nodes: [o1, o2, n] };
  }
  function stopAmb() { if (!amb) return; amb.nodes.forEach(n => { try { n.stop(); } catch (e) {} }); amb.g.disconnect(); amb = null; }
  let buzz = null, breath = null;
  function ensureLoops() {
    if (!A()) return;
    if (!buzz) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 120;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400;
      const g = ac.createGain(); g.gain.value = 0; o.connect(f); f.connect(g); out(g); o.start(); buzz = { g };
    }
    if (!breath) {
      const n = noiseSrc(); const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 650; f.Q.value = 2;
      const g = ac.createGain(); g.gain.value = 0;
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.38; const lg = ac.createGain(); lg.gain.value = 0;
      lfo.connect(lg); lg.connect(g.gain); n.connect(f); f.connect(g);
      const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
      if (p) { g.connect(p); p.connect(master); } else g.connect(master);
      n.start(); lfo.start(); breath = { g, lg, p };
    }
  }
  function setLoops(buzzOn, breathLevel, breathPan) {
    if (!ac || !buzz) return; const t = ac.currentTime;
    buzz.g.gain.setTargetAtTime(buzzOn ? 0.03 : 0, t, 0.03);
    breath.g.gain.setTargetAtTime(breathLevel * 0.45, t, 0.25); breath.lg.gain.setTargetAtTime(breathLevel * 0.45, t, 0.25);
    if (breath.p) breath.p.pan.setTargetAtTime(breathPan, t, 0.1);
  }
  let mbTimer = null;
  function musicBox(on) {
    clearInterval(mbTimer); mbTimer = null;
    if (!on || !A()) return;

  // ================= INPUT =================
  function toggleCam() {
    if (G.powerOut) return;
    G.camUp = !G.camUp; blip(); staticBurst(0.25, 0.12);
    if (G.camUp) { G.lights.L = G.lights.R = false; }
  }
  function toggleDoor(s) { if (G.powerOut) return; G.doors[s] = !G.doors[s]; slam(s === 'L' ? -0.8 : 0.8); }
  function toggleLight(s) {
    if (G.powerOut || G.camUp) return;
    const other = s === 'L' ? 'R' : 'L';
    G.lights[s] = !G.lights[s]; G.lights[other] = false; blip();
  }
  function switchCam(k) { if (k !== G.cam) { G.cam = k; blip(); staticBurst(0.3, 0.12); G.glitch = Math.max(G.glitch, 0.15); } }
  function click(x, y) {
    if (locked) return;
    A();
    if (state === 'menu') {
      if (inRect(x, y, MENU_NEW)) { night = 1; save('fnacNight', '1'); startNight(1); }
      else if (night > 1 && inRect(x, y, MENU_CONT)) startNight(night);
      return;
    }
    if (state === 'dead') {
      if (inRect(x, y, DEAD_RETRY)) startNight(G.n);
      else if (inRect(x, y, DEAD_MENU)) goto('menu');
      return;
    }
    if (state === 'win') { if (stateT > 1) goto('menu'); return; }
    if (state !== 'night') return;
    if (G.call && !G.callMuted && inRect(x, y, [470, 133, 110, 30])) { G.callMuted = true; return; }
    if (inRect(x, y, [440, H - 44, 400, 36])) { toggleCam(); return; }
    if (G.camUp) {
      for (const k of CAM_ORDER) { const [mx, my] = MAP[k]; if (inRect(x, y, [mx - 32, my - 15, 64, 30])) { switchCam(k); return; } }
      return;
    }
    const hit = (bx, by) => (x - bx) * (x - bx) + (y - by) * (y - by) < 40 * 40;
    if (hit(290, 330)) toggleDoor('L'); else if (hit(290, 440)) toggleLight('L');
    else if (hit(990, 330)) toggleDoor('R'); else if (hit(990, 440)) toggleLight('R');
  }
  function canvasXY(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); const [x, y] = canvasXY(e); click(x, y); });
  cv.addEventListener('pointermove', e => { const [x, y] = canvasXY(e); mouse.x = x; mouse.y = y; });
  document.addEventListener('keydown', e => {
    if (locked) return;
    if (state !== 'night') { if ((e.key === ' ' || e.key === 'Enter') && state === 'menu') { e.preventDefault(); startNight(night); } return; }
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 's') { e.preventDefault(); if (!e.repeat) toggleCam(); }
    else if (k === 'q' && !e.repeat) toggleDoor('L');
    else if (k === 'e' && !e.repeat) toggleDoor('R');
    else if (k === 'a' && !e.repeat) toggleLight('L');
    else if (k === 'd' && !e.repeat) toggleLight('R');
    else if (G.camUp && k >= '1' && k <= '8') switchCam(CAM_ORDER[parseInt(k, 10) - 1]);
  });

  // ================= LOOP =================
  let last = 0;
  function frame(t) {
    const dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016; last = t;
    update(dt);
    if (state === 'menu') drawMenu();
    else if (state === 'card') drawCard();
    else if (state === 'night') {
      if (G.camAnim > 0.5 && G.camUp) drawCams(); else drawOffice(dt);
      if (G.camUp !== (G.camAnim > 0.5)) drawNoise(0.5); // flip transition
      hud();
    }
    else if (state === 'scare') drawScare();
    else if (state === 'dead') drawDead();
    else if (state === 'six') drawSix();
    else if (state === 'win') drawWin();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
