<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Demetrius · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1020; color: #f2f3ff; font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 16px 12px 32px; }
  .wrap { max-width: 520px; margin: 0 auto; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  a.back, button { color: #f2f3ff; background: #24274a; padding: 8px 14px; border-radius: 10px; text-decoration: none; font: 700 15px Rubik, sans-serif; border: none; cursor: pointer; }
  h1 { font-family: 'Press Start 2P', monospace; font-size: 13px; color: #ffcc33; line-height: 1.5; }
  .stats { display: flex; justify-content: center; gap: 18px; margin-bottom: 12px; font-weight: 700; color: #9aa0c7; }
  .stats b { color: #ffcc33; }
  .field { background: radial-gradient(circle at 50% 30%, #5fae3c, #3f7f26); border-radius: 18px; padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; position: relative; cursor: crosshair; user-select: none; }
  .hole { position: relative; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: radial-gradient(ellipse at 50% 70%, #1a0f06 50%, #3a2412 72%); box-shadow: inset 0 -10px 0 #5a3a1c; }
  .mole { position: absolute; left: 12%; width: 76%; height: 86%; bottom: -90%; border-radius: 45% 45% 10% 10%; background: #7a3a14 center/cover no-repeat; border: 3px solid #2b1306; transition: bottom .12s ease-out; }
  .mole.up { bottom: 4%; }
  .mole.bomb { background: #222 !important; border-color: #ff3030; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .mole.hit { filter: brightness(1.8) saturate(0); transform: scale(.85); }
  .pop { position: absolute; font: 800 24px Rubik; color: #fff; pointer-events: none; animation: rise .7s forwards; text-shadow: 2px 2px 0 #2b0a3d; }
  @keyframes rise { to { transform: translateY(-40px); opacity: 0; } }
  .over { position: absolute; inset: 0; background: rgba(15,16,32,.85); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; z-index: 5; }
  .over h2 { font-family: 'Press Start 2P', monospace; font-size: 18px; color: #ffcc33; line-height: 1.6; }
  .help { color: #9aa0c7; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>WHACK-A-<br>DEMETRIUS</h1><span></span></div>
  <div class="stats"><span>Score <b id="score">0</b></span><span>Time <b id="time">30</b></span><span>Best <b id="best">0</b></span><span>Combo <b id="combo">x1</b></span></div>
  <div class="field" id="field"></div>
  <p class="help">Bonk Demetrius when he pops up. Don't hit the 💣 bombs! Hits in a row build your combo.</p>
</div>
<script>
(() => {
  const field = document.getElementById('field');
  const $ = id => document.getElementById(id);
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  save('gr_plays_whack', String(parseInt(load('gr_plays_whack') || '0', 10) + 1));
  let best = parseInt(load('whackBest') || '0', 10); $('best').textContent = best;
  let photoURL = null;
  const img = new Image(); img.onload = () => { photoURL = img.src; document.querySelectorAll('.mole:not(.bomb)').forEach(m => m.style.backgroundImage = 'url(' + photoURL + ')'); }; img.src = 'demetrius.jpg';
  const moles = [];
  for (let i = 0; i < 9; i++) {
    const h = document.createElement('div'); h.className = 'hole';
    const m = document.createElement('div'); m.className = 'mole'; h.appendChild(m); field.appendChild(h);
    const o = { el: m, up: false, bomb: false, timer: null };
    m.addEventListener('pointerdown', e => { e.stopPropagation(); hit(o, e); });
    moles.push(o);
  }
  let score = 0, time = 30, combo = 1, running = false, spawnT = null, clockT = null;
  let ac = null;
  function snd(f0, f1, d, type, vol) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
  function popText(e, txt, color) { const r = field.getBoundingClientRect(); const p = document.createElement('div'); p.className = 'pop'; p.textContent = txt; p.style.color = color; p.style.left = (e.clientX - r.left - 20) + 'px'; p.style.top = (e.clientY - r.top - 30) + 'px'; field.appendChild(p); setTimeout(() => p.remove(), 700); }
  function show(o) {
    if (o.up) return;
    o.bomb = Math.random() < Math.min(0.25, 0.08 + (30 - time) * 0.006);
    o.el.className = 'mole' + (o.bomb ? ' bomb' : '');
    o.el.textContent = o.bomb ? '💣' : '';
    o.el.style.backgroundImage = !o.bomb && photoURL ? 'url(' + photoURL + ')' : '';
    void o.el.offsetWidth; o.el.classList.add('up'); o.up = true;
    const stay = Math.max(450, 1100 - (30 - time) * 22);
    o.timer = setTimeout(() => { if (o.up) { o.el.classList.remove('up'); o.up = false; if (!o.bomb) { combo = 1; $('combo').textContent = 'x1'; } } }, stay);
  }
  function hit(o, e) {
    if (!running || !o.up) return;
    clearTimeout(o.timer); o.up = false; o.el.classList.add('hit');
    setTimeout(() => { o.el.classList.remove('up', 'hit'); }, 120);
    if (o.bomb) { score = Math.max(0, score - 5); combo = 1; snd(200, 50, 0.4, 'sawtooth', 0.15); popText(e, '-5 💥', '#ff5050'); field.animate([{ transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], 200); }
    else { const pts = combo; score += pts; snd(500 + combo * 40, 900 + combo * 40, 0.1, 'square', 0.08); popText(e, '+' + pts, '#ffcc33'); combo = Math.min(5, combo + 1); }
    $('score').textContent = score; $('combo').textContent = 'x' + combo;
  }
  field.addEventListener('pointerdown', () => { if (running) { combo = 1; $('combo').textContent = 'x1'; snd(150, 120, 0.05, 'triangle', 0.05); } });
  function spawnLoop() {
    if (!running) return;
    const free = moles.filter(m => !m.up);
    if (free.length) show(free[Math.floor(Math.random() * free.length)]);
    if (time < 20 && Math.random() < 0.35 && free.length > 1) show(free[Math.floor(Math.random() * free.length)]);
    spawnT = setTimeout(spawnLoop, Math.max(330, 800 - (30 - time) * 18));
  }
  function start() {
    field.querySelectorAll('.over').forEach(o => o.remove());
    score = 0; time = 30; combo = 1; running = true;
    $('score').textContent = 0; $('time').textContent = 30; $('combo').textContent = 'x1';
    spawnLoop();
    clockT = setInterval(() => { time--; $('time').textContent = time; if (time <= 5) snd(800, 800, 0.05, 'square', 0.05); if (time <= 0) end(); }, 1000);
  }
  function end() {
    running = false; clearTimeout(spawnT); clearInterval(clockT);
    moles.forEach(m => { clearTimeout(m.timer); m.up = false; m.el.classList.remove('up'); });
    const nb = score > best; if (nb) { best = score; save('whackBest', best); $('best').textContent = best; }
    overlay("TIME'S UP!", 'You bonked ' + score + ' points' + (nb ? ' · NEW BEST!' : ''), 'Play again');
    snd(600, 200, 0.5, 'triangle', 0.1);
  }
  function overlay(title, sub, btn) {
    const o = document.createElement('div'); o.className = 'over';
    o.innerHTML = '<h2>' + title + '</h2><div style="font-weight:700">' + sub + '</div>';
    const b = document.createElement('button'); b.textContent = btn; b.style.background = '#ffcc33'; b.style.color = '#1a1300';
    b.onclick = e => { e.stopPropagation(); start(); }; o.appendChild(b); field.appendChild(o);
  }
  overlay('WHACK-A-<br>DEMETRIUS', '30 seconds. Bonk him as many times as you can.', 'Start');
})();
</script>
</body>
</html>
