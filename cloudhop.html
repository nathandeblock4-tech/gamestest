<!DOCTYPE html>

<title>Cloudhop · Games Site</title>

<script>
'use strict';
/*CORE-START*/
const T = 16, PW = 10, PHH = 14;
const K = { RUN: 128, ACC: 1500, DEC: 1900, AIRACC: 1000, AIRDEC: 650, GRAV: 1500, MAXFALL: 330, FASTFALL: 420, JUMP: 400, CUTG: 2.4, APEX: 0.55, COYOTE: 0.1, BUFFER: 0.12, SLIDE: 75, WJX: 170, WJY: 385, WJLOCK: 0.14, DASH: 320, DASHT: 0.15, SPRING: 650, STOMP: 330 };
const SOLID = { '#': 1, 'B': 2, '-': 3, '^': 4, 'v': 4, '<': 4, '>': 4, 'C': 5, 'L': 6 };
function parseLevel(def) {
  const rows = def.rows, h = rows.length, w = Math.max(...rows.map(r => r.length));
  const L = { def, w, h, t: new Uint8Array(w * h), sd: {}, crum: {}, ents: [], plats: [], springs: [], crystals: [], start: { x: 0, y: 0 }, dash: !!def.dash, time: 0 };

    const ch = rows[y][x] || '.', px = x * T, py = y * T;
    if (SOLID[ch]) { L.t[y * w + x] = SOLID[ch]; if (SOLID[ch] === 4) L.sd[y * w + x] = ch; continue; }

    else if (ch === 'S') L.springs.push({ x: px + 1, y: py + 8, w: 14, h: 8, anim: 0 });

const tAt = (L, tx, ty) => tx < 0 || tx >= L.w ? 1 : ty < 0 || ty >= L.h ? 0 : L.t[ty * L.w + tx];
function solidTile(L, tx, ty) { const v = tAt(L, tx, ty); if (v === 1 || v === 2) return true; if (v === 5) { const c = L.crum[ty * L.w + tx]; return !c || c.gone <= 0; } return false; }
function rectSolid(L, x, y, w, h) { const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 1) / T), y0 = Math.floor(y / T), y1 = Math.floor((y + h - 1) / T); for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solidTile(L, tx, ty)) return true; return false; }

  for (const p of L.plats) if (Math.round(p.y) === b && P.x + PW > p.x && P.x < p.x + p.w) return p;
  return false;
}
function newPlayer(L) { return { x: L.start.x, y: L.start.y, vx: 0, vy: 0, rx: 0, ry: 0, ground: false, coyote: 0, buf: 0, lock: 0, lockDir: 0, dashes: 1, dashT: 0, dvx: 0, dvy: 0, face: 1, drop: 0, spring: false, dead: false, ev: [], slide: 0, onPlat: null }; }
function moveX(P, L, a) { P.rx += a; let m = Math.round(P.rx); P.rx -= m; const s = Math.sign(m); while (m) { if (!rectSolid(L, P.x + s, P.y, PW, PHH)) { P.x += s; m -= s; } else { P.rx = 0; return true; } } return false; }
function moveY(P, L, a) { P.ry += a; let m = Math.round(P.ry); P.ry -= m; const s = Math.sign(m); while (m) { if (rectSolid(L, P.x, P.y + s, PW, PHH) || (s > 0 && platBelow(L, P))) { P.ry = 0; return true; } P.y += s; m -= s; } return false; }
const groundUnder = (P, L) => rectSolid(L, P.x, P.y + 1, PW, PHH) || !!platBelow(L, P);
function hazard(L, P) {
  if (P.y > L.h * T + 8) return true;
  const x0 = Math.floor(P.x / T), x1 = Math.floor((P.x + PW - 1) / T), y0 = Math.floor(P.y / T), y1 = Math.floor((P.y + PHH - 1) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const v = tAt(L, tx, ty); if (v !== 4 && v !== 6) continue;
    let hx = tx * T, hy = ty * T, hw = T, hh = T;
    if (v === 6) { hy += 5; hh -= 5; }
    else { const d = L.sd[ty * L.w + tx]; if (d === '^') { hy += 9; hh = 7; hx += 2; hw = 12; } else if (d === 'v') { hh = 7; hx += 2; hw = 12; } else if (d === '<') { hw = 7; hy += 2; hh = 12; } else { hx += 9; hw = 7; hy += 2; hh = 12; } }

  }

}
const overlap = (P, e) => P.x < e.x + e.w && P.x + PW > e.x && P.y < e.y + e.h && P.y + PHH > e.y;
function updateLevel(L, P, dt) {
  L.time += dt;
  for (const k in L.crum) { const c = L.crum[k]; if (c.t > 0) { c.t -= dt; if (c.t <= 0) c.gone = 2.6; } else if (c.gone > 0) { c.gone -= dt; if (c.gone <= 0) { const tx = k % L.w, ty = (k / L.w) | 0; if (P && P.x < tx * T + T && P.x + PW > tx * T && P.y < ty * T + T && P.y + PHH > ty * T) c.gone = 0.1; else delete L.crum[k]; } } }

function stepPlayer(P, L, inp, dt) {
  if (P.dead) return;
  P.ev.length = 0;
  const wasGround = P.ground; P.ground = groundUnder(P, L);
  if (P.drop > 0) P.drop -= dt;
  if (P.ground) { P.coyote = K.COYOTE; if (P.dashT <= 0) P.dashes = 1; P.spring = false; if (!wasGround) P.ev.push('land'); }
  else P.coyote -= dt;
  if (inp.jp) P.buf = K.BUFFER; else P.buf -= dt;
  // crumble blocks start breaking when stood on

  const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  if (dir) P.face = dir;
  // dash
  if (inp.dp && L.dash && P.dashes > 0 && P.dashT <= 0) {
    let dx = dir, dy = (inp.d ? 1 : 0) - (inp.u ? 1 : 0); if (!dx && !dy) dx = P.face;
    const n = Math.hypot(dx, dy); P.dvx = dx / n * K.DASH; P.dvy = dy / n * K.DASH; P.dashT = K.DASHT; P.dashes = 0; P.ev.push('dash'); P.buf = 0;
  }
