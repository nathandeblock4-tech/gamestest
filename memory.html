<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Memory Match · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1020; color: #f2f3ff; font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 12px; }
  .wrap { max-width: 620px; margin: 0 auto; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  a.back, button.ui { color: #f2f3ff; background: #24274a; padding: 8px 14px; border-radius: 10px; text-decoration: none; font: 800 14px Rubik, sans-serif; border: 2px solid transparent; cursor: pointer; }
  button.ui.on { border-color: #f472b6; color: #f472b6; }
  h1 { font-weight: 900; font-size: 18px; letter-spacing: 2px; color: #f472b6; }
  .row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .stats { display: flex; justify-content: center; gap: 18px; font-weight: 800; margin-bottom: 10px; }
  .stats span { color: #9aa0c7; font-weight: 600; }
  #grid { display: grid; gap: 8px; margin: 0 auto; max-width: min(100%, calc(100vh - 250px)); }
  .card { aspect-ratio: 1; perspective: 600px; cursor: pointer; border: none; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
  .in { position: relative; width: 100%; height: 100%; transition: transform .28s; transform-style: preserve-3d; }
  .card.up .in { transform: rotateY(180deg); }
  .f { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; align-items: center; justify-content: center; }
  .f.back { background: linear-gradient(135deg, #7c3aed, #f472b6); font-size: clamp(16px, 5vw, 28px); color: rgba(255,255,255,.5); font-weight: 900; }
  .f.front { background: #f2f3ff; transform: rotateY(180deg); font-size: clamp(22px, 8vw, 46px); }
  .card.done .f.front { background: #86efac; animation: pop .35s; }
  @keyframes pop { 50% { transform: rotateY(180deg) scale(1.12); } }
  #msg { font-weight: 900; font-size: 20px; color: #4ade80; min-height: 28px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>MEMORY MATCH</h1><span style="width:60px"></span></div>
  <div class="row" id="sizes"><button class="ui" data-s="0">Small 4×3</button><button class="ui" data-s="1">Medium 4×4</button><button class="ui" data-s="2">Large 6×5</button></div>
  <div class="stats"><div><span>Moves</span> <b id="moves">0</b></div><div><span>Time</span> <b id="time">0:00</b></div><div><span>Best</span> <b id="best">-</b></div></div>
  <div id="grid"></div>
  <div id="msg"></div>
  <button class="ui" id="again" style="margin-top:6px">↻ New game</button>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  function ld(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
  function sv(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  const SIZES = [[4, 3], [4, 4], [6, 5]];
  const EMO = ['🍌', '🐒', '🚀', '🎮', '🍕', '⚽', '🎸', '🐍', '👻', '🦊', '🌈', '💎', '🔥', '🍩', '🐙', '🎯', '🧠', '🦖', '🍉', '⭐', '🎲', '🛹', '🐸', '🍔'];
  let size = +ld('memSize', 1), cards, open, lock, moves, found, t0, timer, done;
  let ac = null;
  function tone(f, d, vol, type) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain(); o.type = type || 'triangle'; o.frequency.value = f; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  function showBest() { const b = JSON.parse(ld('memBest' + size, 'null')); $('best').textContent = b ? b.m + ' moves · ' + fmt(b.t) : '-'; }
  function start() {
    const [c, r] = SIZES[size], n = c * r / 2;
    const pool = EMO.slice().sort(() => Math.random() - 0.5).slice(0, n), deck = pool.concat(pool);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const grid = $('grid'); grid.innerHTML = ''; grid.style.gridTemplateColumns = 'repeat(' + c + ', 1fr)';
    cards = deck.map((e, i) => {
      const b = document.createElement('button'); b.className = 'card'; b.setAttribute('aria-label', 'Card ' + (i + 1));
      b.innerHTML = '<div class="in"><div class="f back">?</div><div class="f front"></div></div>';
      b.onclick = () => flip(i); grid.appendChild(b); return { e, el: b, up: false, done: false };
    });
    open = []; lock = false; moves = 0; found = 0; t0 = 0; done = false; clearInterval(timer);
    $('moves').textContent = 0; $('time').textContent = '0:00'; $('msg').textContent = '';
    document.querySelectorAll('#sizes button').forEach(b => b.classList.toggle('on', +b.dataset.s === size)); showBest();
  }
  function flip(i) {
    const c = cards[i]; if (lock || c.up || c.done || done) return;
    if (!t0) { t0 = Date.now(); timer = setInterval(() => { $('time').textContent = fmt((Date.now() - t0) / 1000); }, 250); }
    c.up = true; c.el.classList.add('up'); c.el.querySelector('.front').textContent = c.e; tone(520, 0.05, 0.06); open.push(i);
    if (open.length < 2) return;
    moves++; $('moves').textContent = moves;
    const [a, b] = open.map(k => cards[k]); open = [];
    if (a.e === b.e) {
      a.done = b.done = true; setTimeout(() => { a.el.classList.add('done'); b.el.classList.add('done'); }, 150); found++; tone(784, 0.12, 0.1); setTimeout(() => tone(1047, 0.15, 0.1), 90);
      if (found === cards.length / 2) {
        done = true; clearInterval(timer); const t = (Date.now() - t0) / 1000; $('time').textContent = fmt(t);
        const old = JSON.parse(ld('memBest' + size, 'null')), better = !old || moves < old.m || (moves === old.m && t < old.t);
        if (better) sv('memBest' + size, JSON.stringify({ m: moves, t: Math.floor(t) }));
        $('msg').textContent = '🎉 Done in ' + moves + ' moves and ' + fmt(t) + (better ? ' · New best!' : ''); showBest();
        [523, 659, 784, 1047].forEach((f, k) => setTimeout(() => tone(f, 0.25, 0.1), 300 + k * 110));
      }
    } else {
      lock = true; setTimeout(() => { for (const x of [a, b]) { x.up = false; x.el.classList.remove('up'); } lock = false; setTimeout(() => { if (!a.up) a.el.querySelector('.front').textContent = ''; if (!b.up) b.el.querySelector('.front').textContent = ''; }, 280); }, 800);
      setTimeout(() => tone(200, 0.12, 0.06, 'sawtooth'), 200);
    }
  }
  document.querySelectorAll('#sizes button').forEach(b => b.onclick = () => { size = +b.dataset.s; sv('memSize', size); start(); });
  $('again').onclick = start;
  window.__m = { cards: () => cards.map(c => c.e), flip };
  start();
})();
</script>
<script src="presence.js" defer></script>
</body>
</html>
