<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex">
<title>Tung Tung Conner · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #120c1f; color: #fff; font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 12px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  a.back { color: #fff; background: #2a2145; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 800; }
  h1 { font-weight: 900; font-size: 18px; letter-spacing: 2px; color: #ffb547; text-align: center; }
  .grid { display: grid; grid-template-columns: 1fr 340px; gap: 14px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: #1b1430; border: 1px solid #2f2550; border-radius: 16px; padding: 12px; }
  .count { font-size: 30px; font-weight: 900; text-align: center; }
  .rate { color: #b7a9e0; text-align: center; font-weight: 600; margin-bottom: 8px; }
  canvas { width: 100%; aspect-ratio: 500 / 520; display: block; border-radius: 14px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .hint { color: #b7a9e0; text-align: center; font-size: 13px; margin-top: 8px; }
  .shop h2 { font-size: 18px; margin-bottom: 8px; color: #ffb547; }
  .item { display: flex; gap: 10px; align-items: center; width: 100%; background: #241b3d; border: 2px solid #33295a; border-radius: 12px; padding: 9px 10px; margin-bottom: 8px; color: #fff; font-family: inherit; text-align: left; cursor: pointer; }
  .item:disabled { opacity: .45; cursor: default; }
  .item:not(:disabled):hover { border-color: #ffb547; }
  .item .ic { font-size: 26px; width: 34px; text-align: center; }
  .item .nm { flex: 1; font-size: 13px; color: #b7a9e0; } .item .nm b { display: block; color: #fff; font-size: 15px; }
  .item .pr { text-align: right; font-weight: 800; color: #ffb547; font-size: 14px; } .item .pr small { display: block; color: #b7a9e0; font-weight: 600; }
  .reset { background: none; border: none; color: #665d80; font: 600 12px Rubik, sans-serif; cursor: pointer; margin-top: 6px; }
  #lock { position: fixed; inset: 0; z-index: 100; background: #120c1f; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
  #lock input { background: #1b1430; border: 2px solid #33295a; border-radius: 10px; color: #fff; font: 700 18px Rubik, sans-serif; padding: 10px 14px; width: 220px; text-align: center; }
  #lock button { background: #ffb547; color: #2a1600; border: none; border-radius: 10px; padding: 11px 20px; font: 800 16px Rubik, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div id="lock">
  <div style="font-size:54px">🔒</div>
  <h2 style="font-weight:900;font-size:22px;color:#ffb547;letter-spacing:2px">TUNG TUNG CONNER</h2>
  <div style="color:#b7a9e0">This game is locked. Enter the password.</div>
  <form id="lockForm" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><input id="pw" type="password" placeholder="Password" autocomplete="off"><button>Unlock</button></form>
  <div id="lockMsg" style="color:#ff8a8a;font-weight:700;min-height:20px"></div>
  <a class="back" href="index.html">← Back</a>
</div>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>TUNG TUNG TUNG CONNER SAHUR</h1><span style="width:60px"></span></div>
  <div class="grid">
    <div class="panel">
      <div class="count" id="count">0 tungs</div>
      <div class="rate" id="rate">0 per second</div>
      <canvas id="c" width="500" height="520"></canvas>
      <div class="hint">Tap fast! 9 TUNGs in a row = <b style="color:#ffb547">SAHUR!</b> bonus. Space bar works too.</div>
      <div style="text-align:center"><button class="reset" id="reset">reset progress</button></div>
    </div>
    <div class="panel shop"><h2>Shop</h2><div id="shop"></div></div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  const cv = $('c'), g = cv.getContext('2d'), W = 500, H = 520;
  const face = new Image(), gold = new Image();
  let faceOK = false, goldOK = false, started = false;
  face.onload = () => { faceOK = true; }; gold.onload = () => { goldOK = true; };

  async function decrypt(file, pw) {
    const raw = new Uint8Array(await (await fetch(file, { cache: 'no-store' })).arrayBuffer());
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
    return URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' }));
  }
  async function unlock(pw) {
    face.src = await decrypt('conner_tung.bin', pw);
    $('lock').style.display = 'none'; started = true; nextGold = 25 + Math.random() * 20;
    decrypt('conner2.bin', pw).then(u => { gold.src = u; }).catch(() => {});
  }
  async function tryPw(pw, remember) {
    $('lockMsg').style.color = '#b7a9e0'; $('lockMsg').textContent = 'Checking...';
    try { await unlock(pw); if (remember) save('fnac_pw', pw); }
    catch (e) { $('lockMsg').style.color = '#ff8a8a'; $('lockMsg').textContent = 'Wrong password.'; try { localStorage.removeItem('fnac_pw'); } catch (er) {} }
  }
  $('lockForm').addEventListener('submit', e => { e.preventDefault(); tryPw($('pw').value, true); });
  if (load('fnac_pw')) tryPw(load('fnac_pw'), false); else setTimeout(() => $('pw').focus(), 100);

  // ---------- game state ----------
  const ITEMS = [
    { id: 'bat', ic: '🏏', name: 'Heavier Bat', desc: '+1 per tap', base: 15, tap: 1 },
    { id: 'kid', ic: '🍳', name: 'Kid With a Pan', desc: '+0.5 per second', base: 50, ps: 0.5 },
    { id: 'squad', ic: '🥁', name: 'Drum Squad', desc: '+3 per second', base: 300, ps: 3 },
    { id: 'roof', ic: '🏠', name: 'Rooftop Drummer', desc: '+12 per second', base: 1800, ps: 12 },
    { id: 'band', ic: '🎺', name: 'Marching Band', desc: '+50 per second', base: 10000, ps: 50 },
    { id: 'tower', ic: '📢', name: 'Giant Speaker Tower', desc: '+220 per second', base: 60000, ps: 220 },
    { id: 'golden', ic: '✨', name: 'Golden Bat', desc: 'Taps x2 (stacks)', base: 25000, mul: 2, grow: 6 },
    { id: 'clones', ic: '👥', name: 'Conner Clones', desc: '+1000 per second', base: 400000, ps: 1000 },
  ];
  let S = { n: 0, total: 0, own: {} };
  try { const s = JSON.parse(load('tungConnerSave') || 'null'); if (s && typeof s.n === 'number') S = Object.assign(S, s); } catch (e) {}
  const own = id => S.own[id] || 0;
  const cost = it => Math.ceil(it.base * Math.pow(it.grow || 1.15, own(it.id)));
  function perTap() { let t = 1; ITEMS.forEach(it => { if (it.tap) t += it.tap * own(it.id); }); ITEMS.forEach(it => { if (it.mul) t *= Math.pow(it.mul, own(it.id)); }); return t * (boost > 0 ? 7 : 1); }
  function perSec() { let p = 0; ITEMS.forEach(it => { if (it.ps) p += it.ps * own(it.id); }); return p * (boost > 0 ? 7 : 1); }
  function fmt(x) { x = Math.floor(x); if (x < 1e4) return x.toLocaleString(); const u = ['K', 'M', 'B', 'T', 'Qa']; let i = -1; while (x >= 1000 && i < u.length - 1) { x /= 1000; i++; } return x.toFixed(x < 10 ? 2 : x < 100 ? 1 : 0) + u[i]; }

  // ---------- shop ----------
  const shop = $('shop'), btns = {};
  ITEMS.forEach(it => {
    const b = document.createElement('button'); b.className = 'item';
    b.innerHTML = '<span class="ic"></span><span class="nm"><b></b><span></span></span><span class="pr"></span>';
    b.querySelector('.ic').textContent = it.ic; b.querySelector('b').textContent = it.name; b.querySelector('.nm span').textContent = it.desc;
    b.onclick = () => { const c = cost(it); if (S.n >= c) { S.n -= c; S.own[it.id] = own(it.id) + 1; tone(660, 0.12, 0.1, 'square'); tone(990, 0.15, 0.08, 'square', 0.08); refresh(); } };
    shop.appendChild(b); btns[it.id] = b;
  });
  function refresh() {
    $('count').textContent = fmt(S.n) + ' tungs';
    $('rate').textContent = fmt(perSec()) + ' per second · ' + fmt(perTap()) + ' per tap' + (boost > 0 ? '  🔥 x7!' : '');
    ITEMS.forEach(it => { const b = btns[it.id], c = cost(it); b.disabled = S.n < c; b.querySelector('.pr').innerHTML = fmt(c) + '<small>own ' + own(it.id) + '</small>'; });
  }
  $('reset').onclick = () => { if (confirm('Reset all progress?')) { S = { n: 0, total: 0, own: {} }; save('tungConnerSave', JSON.stringify(S)); refresh(); } };

  // ---------- audio ----------
  let ac = null;
  function actx() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
  function tone(f, d, vol, type, delay) { try { const a = actx(), t = a.currentTime + (delay || 0), o = a.createOscillator(), gn = a.createGain(); o.type = type || 'triangle'; o.frequency.value = f; gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
  function tung(pitch) { // hollow wooden knock
    try {
      const a = actx(), t = a.currentTime;
      const o = a.createOscillator(), gn = a.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(260 * pitch, t); o.frequency.exponentialRampToValueAtTime(120 * pitch, t + 0.18);
      gn.gain.setValueAtTime(0.5, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t + 0.3);
      const len = a.sampleRate * 0.04, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const n = a.createBufferSource(), f = a.createBiquadFilter(), ng = a.createGain(); f.type = 'bandpass'; f.frequency.value = 900 * pitch; ng.gain.value = 0.35;
      n.buffer = buf; n.connect(f); f.connect(ng); ng.connect(a.destination); n.start(t);
    } catch (e) {}
  }

  // ---------- tapping ----------
  let swing = 0, shake = 0, chain = 0, lastTap = 0, pops = [], sahurT = 0, boost = 0, nextGold = 9999, goldC = null, stars = [];
  for (let i = 0; i < 60; i++) stars.push([Math.random() * W, Math.random() * 260, Math.random() * 1.6 + 0.4, Math.random() * 6]);
  function gain(x) { S.n += x; S.total += x; }
  function tap(px, py) {
    if (!started) return;
    if (goldC && Math.hypot(px - goldC.x, py - goldC.y) < 55) { boost = 15; goldC = null; tone(880, 0.2, 0.12); tone(1320, 0.3, 0.12, 'triangle', 0.1); pops.push({ x: W / 2, y: 120, t: 0, s: 'GOLDEN CONNER! x7 FOR 15s', c: '#ffd447', big: 1 }); refresh(); return; }
    const now = performance.now();
    chain = (now - lastTap < 700) ? chain + 1 : 1; lastTap = now;
    swing = 1; shake = 6;
    const v = perTap();
    if (chain >= 10) {
      chain = 0; sahurT = 1.2; shake = 16; const bonus = v * 15 + perSec() * 5; gain(bonus);
      tone(196, 0.5, 0.15, 'sawtooth'); tone(247, 0.5, 0.12, 'sawtooth', 0.12); tone(294, 0.7, 0.12, 'sawtooth', 0.24);
      pops.push({ x: W / 2, y: 90, t: 0, s: 'SAHUR!!! +' + fmt(bonus), c: '#ffb547', big: 1 });
    } else {
      tung(1 + chain * 0.04); gain(v);
      pops.push({ x: 300 + (Math.random() - 0.5) * 120, y: 250 + (Math.random() - 0.5) * 40, t: 0, s: 'TUNG! +' + fmt(v), c: '#fff' });
    }
    refresh();
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); tap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height); });
  document.addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); tap(0, 0); } });

  // ---------- drawing ----------
  function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  function drawScene(time) {
    const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0b0820'); sky.addColorStop(0.6, '#2a1748'); sky.addColorStop(1, '#4a2550');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    stars.forEach(s => { g.globalAlpha = 0.5 + 0.5 * Math.sin(time * 2 + s[3]); g.fillStyle = '#fff'; g.fillRect(s[0], s[1], s[2], s[2]); }); g.globalAlpha = 1;
    // crescent moon
    g.fillStyle = '#ffe9a8'; g.beginPath(); g.arc(420, 70, 30, 0, Math.PI * 2); g.fill(); g.fillStyle = '#120c2a'; g.beginPath(); g.arc(432, 62, 27, 0, Math.PI * 2); g.fill();
    // houses
    g.fillStyle = '#160f28';
    [[0, 330, 90, 120], [80, 300, 70, 150], [380, 310, 120, 140], [430, 280, 60, 170]].forEach(([x, y, w, h]) => { g.fillRect(x, y, w, h); g.beginPath(); g.moveTo(x - 6, y); g.lineTo(x + w / 2, y - 30); g.lineTo(x + w + 6, y); g.fill(); });
    const lit = Math.min(1, S.total / 5000);
    g.fillStyle = 'rgba(255,200,90,' + (0.25 + 0.75 * lit) + ')';
    [[20, 360], [50, 390], [100, 330], [400, 340], [450, 320], [440, 380]].forEach(([x, y], i) => { if (i / 6 < lit + 0.17) g.fillRect(x, y, 14, 16); });
    g.fillStyle = '#2b1d3a'; g.fillRect(0, 450, W, 70);
  }
  function drawDrum(hit) {
    // hanging slit drum on a wooden frame
    g.fillStyle = '#5a3a1e'; g.fillRect(330, 160, 10, 300); g.fillRect(450, 160, 10, 300); g.fillRect(320, 150, 150, 14);
    g.strokeStyle = '#c9a36b'; g.lineWidth = 3; g.beginPath(); g.moveTo(395, 164); g.lineTo(395, 205); g.stroke();
    const wob = Math.sin(performance.now() / 40) * 5 * hit;
    g.save(); g.translate(395 + wob, 205); g.rotate(wob * 0.01);
    const grd = g.createLinearGradient(-26, 0, 26, 0); grd.addColorStop(0, '#6b4220'); grd.addColorStop(0.5, '#b07a3d'); grd.addColorStop(1, '#6b4220');
    g.fillStyle = grd; rr(-26, 0, 52, 170, 22); g.fill();
    g.fillStyle = '#2a170a'; rr(-5, 30, 10, 110, 5); g.fill();
    g.strokeStyle = '#4a2c12'; g.lineWidth = 3; [20, 150].forEach(y => { g.beginPath(); g.moveTo(-26, y); g.lineTo(26, y); g.stroke(); });
    if (hit > 0.3) { g.strokeStyle = 'rgba(255,230,160,' + hit + ')'; g.lineWidth = 4; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(0, 85, 40 + k * 16 + (1 - hit) * 30, -0.9, 0.9); g.stroke(); g.beginPath(); g.arc(0, 85, 40 + k * 16 + (1 - hit) * 30, Math.PI - 0.9, Math.PI + 0.9); g.stroke(); } }
    g.restore();
  }
  function drawConner(time) {
    const bob = Math.sin(time * 4) * 3, cx = 190, by = 300 + bob;
    // legs
    g.fillStyle = '#2b3550'; rr(cx - 34, by + 80, 28, 90, 8); g.fill(); rr(cx + 6, by + 80, 28, 90, 8); g.fill();
    g.fillStyle = '#eee'; rr(cx - 40, by + 162, 38, 16, 6); g.fill(); rr(cx + 2, by + 162, 38, 16, 6); g.fill();
    // torso (blue shirt)
    g.fillStyle = '#2f6fd0'; rr(cx - 48, by - 20, 96, 108, 22); g.fill();
    g.fillStyle = 'rgba(255,255,255,.12)'; rr(cx - 40, by - 14, 30, 90, 14); g.fill();
    // left arm resting
    g.strokeStyle = '#2f6fd0'; g.lineWidth = 22; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx - 42, by); g.lineTo(cx - 62, by + 60); g.stroke();
    g.fillStyle = '#e6b894'; g.beginPath(); g.arc(cx - 64, by + 66, 11, 0, Math.PI * 2); g.fill();
    // neck + head (photo)
    g.fillStyle = '#e6b894'; g.fillRect(cx - 12, by - 34, 24, 20);
    const hw = 112, hh = hw * 1.22, hy0 = by - 30 - hh / 2 - 6;
    g.save(); g.translate(cx, hy0); g.rotate(Math.sin(time * 4) * 0.04 + swing * 0.08);
    g.beginPath(); g.ellipse(0, 0, hw / 2, hh / 2, 0, 0, Math.PI * 2); g.closePath();
    g.lineWidth = 5; g.strokeStyle = '#120c1f'; g.stroke(); g.save(); g.clip();
    if (faceOK) g.drawImage(face, -hw / 2, -hh / 2, hw, hh); else { g.fillStyle = '#e6b894'; g.fill(); }
    g.restore(); g.restore();
    // right arm + bat (swing: raised back -> forward into drum)
    const ang = swing > 0 ? -0.2 - (1 - swing) * 1.6 : -1.9 + Math.sin(time * 4) * 0.08;
    const sx = cx + 44, sy = by + 4, hx = sx + Math.cos(ang) * 58, hy = sy + Math.sin(ang) * 58;
    g.strokeStyle = '#2f6fd0'; g.lineWidth = 22; g.beginPath(); g.moveTo(sx, sy); g.lineTo(hx, hy); g.stroke();
    g.save(); g.translate(hx, hy); g.rotate(ang);
    const bg = g.createLinearGradient(0, -10, 0, 10); bg.addColorStop(0, '#d9a866'); bg.addColorStop(1, '#8a5a2b');
    g.fillStyle = bg; g.beginPath(); g.moveTo(-8, -5); g.lineTo(120, -14); g.quadraticCurveTo(136, 0, 120, 14); g.lineTo(-8, 5); g.closePath(); g.fill();
    g.restore();
    g.fillStyle = '#e6b894'; g.beginPath(); g.arc(hx, hy, 12, 0, Math.PI * 2); g.fill();
  }
  function draw(time) {
    g.save(); if (shake > 0) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawScene(time); drawDrum(swing); drawConner(time);
    // chain meter
    g.fillStyle = 'rgba(0,0,0,.4)'; rr(20, 16, 210, 34, 10); g.fill();
    for (let i = 0; i < 9; i++) { g.fillStyle = i < chain ? '#ffb547' : 'rgba(255,255,255,.15)'; g.beginPath(); g.arc(38 + i * 20, 33, 7, 0, Math.PI * 2); g.fill(); }
    g.font = '800 11px Rubik, sans-serif'; g.fillStyle = '#ffb547'; g.textAlign = 'left'; g.fillText(chain >= 9 ? 'NOW!' : '', 202, 37);
    // golden conner
    if (goldC) {
      const r = 46 + Math.sin(time * 6) * 4; g.save(); g.translate(goldC.x, goldC.y);
      g.shadowColor = '#ffd447'; g.shadowBlur = 30; g.fillStyle = '#ffd447'; g.beginPath(); g.arc(0, 0, r + 6, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0;
      g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.clip();
      if (goldOK) { const iw = gold.width, ih = gold.height, s = Math.min(iw, ih); g.drawImage(gold, (iw - s) / 2, (ih - s) / 2, s, s, -r, -r, r * 2, r * 2); g.fillStyle = 'rgba(255,200,40,.35)'; g.fillRect(-r, -r, r * 2, r * 2); }
      else { g.fillStyle = '#ffeb99'; g.fillRect(-r, -r, r * 2, r * 2); }
      g.restore();
    }
    // pops
    g.textAlign = 'center';
    pops.forEach(p => { g.globalAlpha = Math.max(0, 1 - p.t); g.font = (p.big ? '900 34px' : '900 24px') + ' Rubik, sans-serif'; g.lineWidth = 5; g.strokeStyle = '#120c1f'; g.strokeText(p.s, p.x, p.y - p.t * 60); g.fillStyle = p.c; g.fillText(p.s, p.x, p.y - p.t * 60); });
    g.globalAlpha = 1;
    if (sahurT > 0) { g.fillStyle = 'rgba(255,181,71,' + sahurT * 0.25 + ')'; g.fillRect(0, 0, W, H); }
    if (boost > 0) { g.font = '900 16px Rubik, sans-serif'; g.fillStyle = '#ffd447'; g.textAlign = 'right'; g.fillText('🔥 x7 · ' + Math.ceil(boost) + 's', W - 18, 40); }
    g.restore();
  }

  // ---------- loop ----------
  let last = 0, saveT = 0, uiT = 0;
  function frame(t) {
    const dt = last ? Math.min(0.1, (t - last) / 1000) : 0.016; last = t; const time = t / 1000;
    if (started) {
      gain(perSec() * dt);
      swing = Math.max(0, swing - dt * 5); shake = Math.max(0, shake - dt * 40); sahurT = Math.max(0, sahurT - dt);
      if (chain && performance.now() - lastTap > 700) chain = 0;
      pops.forEach(p => p.t += dt * (p.big ? 0.6 : 1.3)); pops = pops.filter(p => p.t < 1);
      if (boost > 0) { boost -= dt; if (boost <= 0) { boost = 0; refresh(); } }
      nextGold -= dt;
      if (nextGold <= 0 && !goldC) { goldC = { x: 80 + Math.random() * 340, y: 90 + Math.random() * 140, life: 8 }; nextGold = 40 + Math.random() * 40; tone(1200, 0.15, 0.06); }
      if (goldC) { goldC.life -= dt; if (goldC.life <= 0) goldC = null; }
      saveT += dt; if (saveT > 3) { saveT = 0; save('tungConnerSave', JSON.stringify(S)); }
      uiT += dt; if (uiT > 0.25) { uiT = 0; refresh(); }
    }
    draw(time);
    requestAnimationFrame(frame);
