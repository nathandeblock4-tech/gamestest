<!DOCTYPE html>

<style>

<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>TOWER SIEGE</h1><button class="ui" id="menuBtn">☰ Menu</button></div>
  <div class="hud">
    <div class="pill">❤️ <span id="lives">20</span></div><div class="pill">🪙 <span id="gold">0</span></div><div class="pill">🌊 <span id="wave">0</span>/<span id="waves">30</span></div>

  </div>

    <canvas id="c" width="960" height="576"></canvas>
    <div class="ov on" id="menu">
      <h2>TOWER SIEGE</h2>
      <p>Build towers beside the road and stop 30 waves from reaching your castle.</p>
      <div class="maps" id="maps"></div>
      <div class="row" id="diffs"></div>
      <button class="ui go" id="playBtn" style="font-size:18px;padding:12px 28px">▶ PLAY</button>

    </div>
    <div class="ov" id="end"><h2 id="endT"></h2><p id="endS"></p><div class="row"><button class="ui go" id="againBtn">↻ Play again</button><button class="ui" id="endMenu">Maps</button><button class="ui" id="endlessBtn">Keep going (endless)</button></div></div>
  </div>
  <div class="shop" id="shop"></div>
  <div id="info"></div>
</div>
<script>
(() => {
  'use strict';

  function ld(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }

  const MAPS = [
    { n: 'Meadow', pts: [[-1, 2], [4, 2], [4, 8], [9, 8], [9, 3], [14, 3], [14, 9], [20, 9]], col: ['#3f8f4a', '#368242'] },

  ];
  const DIFFS = [{ n: 'Easy', hp: 0.78, gold: 260, lives: 25 }, { n: 'Normal', hp: 1, gold: 220, lives: 20 }, { n: 'Hard', hp: 1.3, gold: 200, lives: 12 }];
  const TOWERS = [
    { id: 'dart', n: 'Dart', ic: '🎯', cost: 50, range: 130, rate: 0.45, dmg: 8, air: 1, d: 'Cheap and fast. Hits ground and air.', col: '#22c55e' },
    { id: 'cannon', n: 'Cannon', ic: '💣', cost: 110, range: 125, rate: 1.3, dmg: 24, splash: 58, air: 0, d: 'Explodes and hits groups. Cannot hit flyers.', col: '#f97316' },
    { id: 'frost', n: 'Frost', ic: '❄️', cost: 90, range: 110, rate: 1.0, dmg: 4, splash: 48, slow: 0.45, air: 1, d: 'Slows everything it hits.', col: '#38bdf8' },
    { id: 'sniper', n: 'Sniper', ic: '🔭', cost: 150, range: 310, rate: 2.0, dmg: 75, pierce: 1, air: 1, d: 'Huge range and damage. Ignores armor.', col: '#a3a3a3' },
    { id: 'tesla', n: 'Tesla', ic: '⚡', cost: 190, range: 128, rate: 0.9, dmg: 18, chain: 3, air: 1, d: 'Lightning jumps between enemies.', col: '#facc15' },
    { id: 'laser', n: 'Laser', ic: '🔆', cost: 240, range: 150, dps: 34, air: 1, d: 'Constant beam that gets stronger the longer it burns one enemy.', col: '#f43f5e' }
  ];
  const UPC = [0.6, 1.0, 1.6];
  const ET = {
    grunt: { hp: 30, spd: 60, gold: 5, r: 11, col: '#ef4444', cost: 1 }, runner: { hp: 17, spd: 118, gold: 5, r: 8, col: '#fb923c', cost: 1 },
    swarm: { hp: 8, spd: 84, gold: 2, r: 6, col: '#fde047', cost: 0.35 }, tank: { hp: 170, spd: 38, gold: 14, r: 16, col: '#7c3aed', cost: 3.6 },
    armored: { hp: 85, spd: 50, gold: 12, r: 13, col: '#94a3b8', armor: 6, cost: 3 }, flyer: { hp: 38, spd: 78, gold: 8, r: 10, col: '#f0abfc', fly: 1, cost: 1.7 },
    healer: { hp: 70, spd: 56, gold: 12, r: 12, col: '#4ade80', heal: 1, cost: 3 }, boss: { hp: 1050, spd: 27, gold: 150, r: 26, col: '#991b1b', armor: 3, cost: 0, boss: 1 }
  };
  let save = Object.assign({ stars: {}, map: 0, diff: 1 }, ld('tdSave', {}));
  let ac = null, lastS = 0;
  function tone(f, d, vol, type, f2) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
  function sfx(f, d, v, ty, f2) { if (quiet) return; const n = performance.now(); if (n - lastS < 45) return; lastS = n; tone(f, d, v, ty, f2); }

  // ---------- state ----------
  let map, diff, path, segs, pathLen, blocked, bgc, state = 'menu', gold = 0, lives = 20, wave = 0, towers = [], en = [], shots, fx, queue, waveT, waveOn, pick = null, sel = null, hover = null, speed = 1, autoStart = false, endless = false, T = 0, quiet = false, autoT = 0;
  function setup(mi, di) {
    map = MAPS[mi]; diff = DIFFS[di]; path = map.pts.map(p => [p[0] * CS + CS / 2, p[1] * CS + CS / 2]);
    segs = []; pathLen = 0; blocked = new Set();
    for (let i = 0; i < path.length - 1; i++) { const a = path[i], b = path[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push({ a, b, l, s: pathLen }); pathLen += l;
      const A = map.pts[i], B = map.pts[i + 1], dx = Math.sign(B[0] - A[0]), dy = Math.sign(B[1] - A[1]); let x = A[0], y = A[1]; for (;;) { blocked.add(x + ',' + y); if (x === B[0] && y === B[1]) break; x += dx; y += dy; } }
    gold = diff.gold; lives = diff.lives; wave = 0; towers = []; en = []; shots = []; fx = []; queue = []; waveT = 0; waveOn = false; pick = null; sel = null; endless = false; T = 0;
    bgc = null; state = 'play'; $('menu').classList.remove('on'); $('end').classList.remove('on'); hud(); info();
  }
  function posAt(s) { if (s <= 0) return path[0]; for (const sg of segs) if (s <= sg.s + sg.l) { const k = (s - sg.s) / sg.l; return [sg.a[0] + (sg.b[0] - sg.a[0]) * k, sg.a[1] + (sg.b[1] - sg.a[1]) * k]; } return path[path.length - 1]; }

  // ---------- waves ----------
  function rng(seed) { let s = seed | 0; return () => { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 8) & 0xffff) / 65536; }; }

    const types = ['grunt']; if (w >= 3) types.push('runner'); if (w >= 4) types.push('swarm'); if (w >= 6) types.push('tank'); if (w >= 8) types.push('flyer'); if (w >= 11) types.push('armored'); if (w >= 14) types.push('healer');

    if (w % 10 === 0) { const nb = Math.min(4, Math.floor(w / 10)); for (let i = 0; i < nb; i++) out.push({ t: 2 + i * 6, type: 'boss' }); budget *= 0.55; }
    const groups = w < 3 ? 1 : w < 9 ? 2 : 3, newest = types[types.length - 1];
    for (let gi = 0; gi < groups; gi++) {
      let ty = gi === 0 && [3, 4, 6, 8, 11, 14].indexOf(w) >= 0 ? newest : types[Math.floor(r() * types.length)];
      if (ty === 'healer' && gi === 0 && w !== 14) ty = 'grunt';
      const share = budget / groups, n = Math.max(1, Math.round(share / ET[ty].cost * (ty === 'healer' ? 0.5 : 1))), gap = ty === 'swarm' ? 0.22 : ty === 'runner' ? 0.45 : ty === 'tank' || ty === 'armored' ? 1.5 : 0.75;
      for (let i = 0; i < n; i++) out.push({ t: t + i * gap, type: ty });
      t += Math.min(n * gap * 0.6, 7) + 1.5;
    }
    return out.sort((a, b) => a.t - b.t);
  }
  const hpMul = w => (1 + 0.16 * w) * Math.pow(1.06, w) * diff.hp;
  function startWave() {
    if (waveOn || state !== 'play') return;
    wave++; queue = genWave(wave); waveT = 0; waveOn = true; hud(); sfx(330, 0.2, 0.06, 'triangle', 660);
  }
  function spawn(type) {
    const t = ET[type], hp = t.hp * hpMul(wave);
    en.push({ type, s: 0, x: path[0][0], y: path[0][1], hp, max: hp, spd: t.spd, r: t.r, col: t.col, armor: t.armor || 0, fly: !!t.fly, gold: t.gold, slow: 0, slowT: 0, flash: 0, k: 0, boss: !!t.boss, heal: !!t.heal, wob: Math.random() * 6 });
  }

  // ---------- towers ----------
  const tdef = id => TOWERS.find(t => t.id === id);
  function stats(tw) { const d = tdef(tw.id), L = tw.lvl; return { range: d.range * (1 + 0.08 * L), rate: d.rate ? d.rate * Math.pow(0.88, L) : 0, dmg: (d.dmg || 0) * Math.pow(1.6, L), dps: (d.dps || 0) * Math.pow(1.6, L), splash: d.splash ? d.splash * (1 + 0.1 * L) : 0, slow: d.slow ? Math.min(0.7, d.slow + 0.08 * L) : 0, chain: d.chain ? d.chain + L : 0, pierce: d.pierce, air: d.air }; }
  const upCost = tw => tw.lvl >= 3 ? 0 : Math.round(tdef(tw.id).cost * UPC[tw.lvl]);
  const canBuild = (cx, cy) => cx >= 0 && cy >= 0 && cx < GW && cy < GH && !blocked.has(cx + ',' + cy) && !towers.some(t => t.cx === cx && t.cy === cy);
  function place(id, cx, cy) {
    const d = tdef(id); if (!d || gold < d.cost || !canBuild(cx, cy)) return false;

    sfx(220, 0.1, 0.06, 'triangle', 440); hud(); return true;
  }
  function upgrade(tw) { const c = upCost(tw); if (!c || gold < c) return false; gold -= c; tw.spent += c; tw.lvl++; sfx(520, 0.15, 0.07, 'triangle', 1040); fx.push({ k: 'ring', x: tw.x, y: tw.y, r: 40, t: 0, d: 0.4, col: '#facc15' }); hud(); return true; }
  function sell(tw) { gold += Math.round(tw.spent * 0.7); towers = towers.filter(t => t !== tw); sel = null; sfx(440, 0.12, 0.06, 'triangle', 220); hud(); }
  function target(tw, st) {
    let best = null, bv = -1e9;
    for (const e of en) { if (e.dead || (e.fly && !st.air)) continue; const d = Math.hypot(e.x - tw.x, e.y - tw.y); if (d > st.range + e.r) continue; const v = tw.mode === 0 ? e.s : tw.mode === 1 ? e.hp : -d; if (v > bv) { bv = v; best = e; } }
    return best;
  }
  function damage(e, dmg, pierce, tw) {
    if (e.dead) return; const d = pierce ? dmg : Math.max(dmg * 0.15, dmg - e.armor); e.hp -= d; e.flash = 0.08;
    if (e.hp <= 0) { e.dead = true; gold += e.gold; if (tw) tw.kills++; for (let i = 0; i < (e.boss ? 24 : 5); i++) fx.push({ k: 'p', x: e.x, y: e.y, vx: (Math.random() - 0.5) * 220, vy: (Math.random() - 0.5) * 220, t: 0, d: 0.4, col: e.col }); fx.push({ k: 'txt', x: e.x, y: e.y - 10, s: '+' + e.gold, t: 0, d: 0.7 }); sfx(e.boss ? 90 : 500, e.boss ? 0.5 : 0.05, e.boss ? 0.12 : 0.03, e.boss ? 'sawtooth' : 'square'); hud(); }
  }
  function splash(x, y, r, dmg, slow, tw, air) { for (const e of en) { if (e.dead || (e.fly && !air)) continue; if (Math.hypot(e.x - x, e.y - y) < r + e.r) { if (slow) { e.slow = Math.max(e.slow, slow); e.slowT = 1.8; } damage(e, dmg, false, tw); } } }

  // ---------- update ----------
  function update(dt) {
    T += dt;
    if (waveOn) { waveT += dt; while (queue.length && queue[0].t <= waveT) spawn(queue.shift().type);
      if (!queue.length && !en.length) { waveOn = false; const bonus = 18 + wave * 3; gold += bonus; fx.push({ k: 'txt', x: W / 2, y: 80, s: 'Wave ' + wave + ' cleared! +' + bonus + ' gold', t: 0, d: 2, big: 1 }); sfx(660, 0.2, 0.07, 'triangle', 990); autoT = 2.5; hud(); if (wave === 30 && !endless) { finish(true); return; } } }
    else if (autoStart && state === 'play') { autoT -= dt; if (autoT <= 0 && wave > 0) startWave(); }

      if (e.dead) continue; e.flash -= dt; e.wob += dt * 8;
      if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slow = 0; }
      const sp = e.spd * (1 - e.slow * (e.boss ? 0.5 : 1)); e.s += sp * dt;
      if (e.fly) { const k = e.s / pathLen * 1.0, a = path[0], b = path[path.length - 1], tot = Math.hypot(b[0] - a[0], b[1] - a[1]), f = Math.min(1, e.s / tot); e.x = a[0] + (b[0] - a[0]) * f; e.y = a[1] + (b[1] - a[1]) * f + Math.sin(f * 9) * 60; if (f >= 1) leak(e); }
      else { const p = posAt(e.s); e.x = p[0]; e.y = p[1]; if (e.s >= pathLen) leak(e); }
      if (e.heal) { e.k += dt; if (e.k > 1) { e.k = 0; let any = false; for (const o of en) if (!o.dead && o !== e && o.hp < o.max && Math.hypot(o.x - e.x, o.y - e.y) < 90) { o.hp = Math.min(o.max, o.hp + o.max * 0.07); any = true; } if (any) fx.push({ k: 'ring', x: e.x, y: e.y, r: 90, t: 0, d: 0.4, col: '#4ade80' }); } }
    }
    for (const tw of towers) {
      const st = stats(tw), d = tdef(tw.id); tw.cd -= dt;
      const tg = target(tw, st);
      if (tg) tw.a = Math.atan2(tg.y - tw.y, tg.x - tw.x);
      if (tw.id === 'laser') { if (tg) { if (tw.tg === tg) tw.ramp = Math.min(2, tw.ramp + dt * 0.8); else { tw.tg = tg; tw.ramp = 0; } damage(tg, st.dps * (1 + tw.ramp) * dt * (1 - Math.min(0.5, tg.armor * 0.05)), true, tw); tw.beam = tg; if (Math.random() < dt * 6) sfx(900 + tw.ramp * 300, 0.04, 0.012, 'sawtooth'); } else { tw.tg = null; tw.ramp = 0; tw.beam = null; } continue; }
      if (!tg || tw.cd > 0) continue;
      tw.cd = st.rate;
      if (tw.id === 'dart') { shots.push({ k: 'dart', x: tw.x, y: tw.y, tg, spd: 620, dmg: st.dmg, tw }); sfx(700, 0.03, 0.02); }
      else if (tw.id === 'cannon') { shots.push({ k: 'shell', x: tw.x, y: tw.y, tx: tg.x, ty: tg.y, spd: 380, dmg: st.dmg, r: st.splash, tw }); sfx(120, 0.12, 0.05, 'sawtooth', 60); }
      else if (tw.id === 'frost') { shots.push({ k: 'ice', x: tw.x, y: tw.y, tx: tg.x, ty: tg.y, spd: 420, dmg: st.dmg, r: st.splash, slow: st.slow, tw }); sfx(1200, 0.08, 0.02, 'sine', 600); }
      else if (tw.id === 'sniper') { fx.push({ k: 'line', x1: tw.x, y1: tw.y, x2: tg.x, y2: tg.y, t: 0, d: 0.12, col: '#fff' }); damage(tg, st.dmg, true, tw); sfx(1500, 0.1, 0.05, 'square', 200); }
      else if (tw.id === 'tesla') { let cur = tg, px = tw.x, py = tw.y; const used = new Set(); for (let c = 0; c < st.chain && cur; c++) { used.add(cur); fx.push({ k: 'bolt', x1: px, y1: py, x2: cur.x, y2: cur.y, t: 0, d: 0.14 }); damage(cur, st.dmg * Math.pow(0.85, c), false, tw); px = cur.x; py = cur.y; let nx = null, nd = 95; for (const e of en) { if (e.dead || used.has(e)) continue; const dd = Math.hypot(e.x - px, e.y - py); if (dd < nd) { nd = dd; nx = e; } } cur = nx; } sfx(1000, 0.08, 0.03, 'sawtooth', 300); }

    for (const s of shots) {
