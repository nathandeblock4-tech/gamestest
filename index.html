<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e0f1c; --panel: #17192f; --panel-2: #212447; --line: #262a4d; --text: #f2f3ff; --muted: #8f95c2; --accent: #ffcc33; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 16px 50px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  h1 { font-family: 'Press Start 2P', monospace; font-size: clamp(20px, 4.5vw, 30px); color: var(--accent); cursor: pointer; user-select: none; -webkit-user-select: none; }
  .me { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 99px; padding: 8px 14px; font: 700 14px Rubik, sans-serif; cursor: pointer; }
  .me:hover { border-color: var(--accent); }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .search { flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--text); font: 600 15px Rubik, sans-serif; padding: 11px 14px; }
  .search:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: #cfd3ff; border-radius: 99px; padding: 8px 13px; font: 700 13px Rubik, sans-serif; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #1a1300; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; text-decoration: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 10px 14px; transition: transform .12s, border-color .12s; cursor: pointer; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--c); outline: none; }
  .ic { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 34px; background: var(--c); }
  .card h4 { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .card small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .fav { position: absolute; top: 6px; right: 6px; background: none; border: none; font-size: 16px; cursor: pointer; opacity: .35; padding: 4px; }
  .fav.on, .card:hover .fav { opacity: 1; }
  .empty { color: var(--muted); text-align: center; padding: 30px; font-weight: 700; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 40px; }
  /* name popup */
  .modal { position: fixed; inset: 0; background: rgba(5, 6, 15, .75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal.on { display: flex; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: center; }
  .box h2 { font-size: 20px; }
  .box input { background: var(--bg); border: 2px solid var(--panel-2); border-radius: 10px; color: #fff; font: 700 17px Rubik, sans-serif; padding: 11px 14px; text-align: center; }
  .box input:focus { outline: none; border-color: var(--accent); }
  .box p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  /* embedded mini games */
  .screen { display: none; } .screen.active { display: block; }
  .game-box { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 22px 16px; text-align: center; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }
  .topbar h2 { font-size: 22px; }
  .stats { display: flex; gap: 18px; justify-content: center; margin-bottom: 14px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
  .stats b { color: var(--accent); }
  button.btn { background: var(--accent); color: #1a1300; border: none; border-radius: 10px; padding: 10px 18px; font: 700 15px 'Rubik', sans-serif; cursor: pointer; }
  button.btn.ghost { background: var(--panel-2); color: var(--text); }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .msg { min-height: 26px; margin: 12px 0; font-weight: 700; font-size: 18px; }
  .ttt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 320px; margin: 0 auto; }
  .ttt button { aspect-ratio: 1; background: #0a0b17; border: 2px solid var(--panel-2); border-radius: 12px; font: 800 52px 'Rubik', sans-serif; cursor: pointer; color: var(--text); }
  .ttt button.x { color: #60a5fa; } .ttt button.o { color: #f472b6; } .ttt button.win { background: #2d3a1c; border-color: #4ade80; }
  .mode { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .mode button.on { background: var(--accent); color: #1a1300; }
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 400px; margin: 0 auto; }
  .tile { aspect-ratio: 1; border-radius: 12px; border: none; background: var(--panel-2); font-size: 36px; cursor: pointer; transition: transform .2s, background .2s; color: transparent; }
  .tile:hover { transform: scale(1.04); } .tile.flip { background: #0a0b17; color: inherit; } .tile.done { background: #1d3324; color: inherit; cursor: default; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="logo" onclick="show('home')">🎮 GAME ROOM</h1>
    <button class="me" id="meBtn">👤 <span id="meName">Guest</span> ✎</button>
  </header>

  <section id="home" class="screen active">
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="🔍 Search games..." autocomplete="off" aria-label="Search games">
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty"></div>
  </section>

  <section id="ttt" class="screen">
    <div class="game-box">
      <div class="topbar"><button class="btn ghost" onclick="show('home')">← Back</button><h2>❌⭕ Tic-Tac-Toe</h2><button class="btn" onclick="TTT.reset()">Restart</button></div>
      <div class="mode"><button class="btn ghost on" id="modeCpu" onclick="TTT.setMode('cpu')">vs Computer</button><button class="btn ghost" id="modePvp" onclick="TTT.setMode('pvp')">2 Players</button></div>
      <div class="stats"><span>X wins: <b id="tttX">0</b></span><span>O wins: <b id="tttO">0</b></span><span>Draws: <b id="tttD">0</b></span></div>
      <div class="ttt" id="tttBoard"></div>
      <div class="msg" id="tttMsg"></div>
    </div>
  </section>

  <section id="memory" class="screen">
    <div class="game-box">
      <div class="topbar"><button class="btn ghost" onclick="show('home')">← Back</button><h2>🃏 Memory Match</h2><button class="btn" onclick="Memory.start()">Shuffle</button></div>
      <div class="stats"><span>Moves: <b id="memMoves">0</b></span><span>Time: <b id="memTime">0s</b></span><span>Best: <b id="memBest">–</b></span></div>
      <div class="mem" id="memBoard"></div>
      <div class="msg" id="memMsg"></div>
    </div>
  </section>

  <footer id="foot">GAME ROOM</footer>
</div>

<div class="modal" id="nameModal"><div class="box">
  <h2>👋 What's your name?</h2>
  <input id="nameIn" maxlength="20" placeholder="Your name" autocomplete="off">
  <button class="btn" id="nameOk">Let's play</button>
  <p>Your name and the game you're playing are shown to the site owner while you're on the site.</p>
</div></div>

<script src="presence.js"></script>
<script>
function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function loadJ(key, d) { try { const v = JSON.parse(load(key) || 'null'); return v == null ? d : v; } catch (e) { return d; } }

const GAMES = [
  { id: 'hopper', href: 'hopper.html', t: 'Road Hopper', d: 'Hop across busy roads, rivers and train tracks in 3D. Collect coins to unlock 6 characters.', i: '🐔', cat: 'arcade', tags: ['NEW', '3D'], c: ['#38c95c', '#1f7a8c'], n: 27 },
  { id: 'fakele', href: 'fakele.html', t: 'Fakele', d: 'Guess the secret 5-letter word in 6 tries. New daily word every day, plus unlimited mode.', i: '🟩', cat: 'puzzle', tags: ['NEW', 'DAILY'], c: ['#22c55e', '#a16207'], n: 26 },
  { id: 'chess', href: 'chess.html', t: 'Chess', d: 'Play a friend on one device, the computer (5 levels), or online with a room code.', i: '♞', cat: 'puzzle', tags: ['NEW', 'ONLINE', '2P'], c: ['#769656', '#2b3a1c'], n: 25 },
  { id: 'dash', href: 'dash.html', t: 'Neon Dash', d: 'Jump to the beat across 6 levels: ship tunnels, ball mode, gravity flips and secret coins.', i: '🟦', cat: 'arcade', tags: ['NEW'], c: ['#00e5ff', '#7b2cff'], n: 24 },
  { id: 'catch', href: 'catch.html', t: 'Banana Catch', d: 'Move Demetrius to catch falling bananas and dodge the coconuts. Golden bananas are worth 5.', i: '🍌', cat: 'demetrius', tags: [], c: ['#ffd23f', '#1b4a3a'], n: 23 },
  { id: 'invaders', href: 'invaders.html', t: 'Banana Invaders', d: 'A space shooter where you fire bananas at an invading army of Demetriuses.', i: '🚀', cat: 'arcade', tags: [], c: ['#2b1d6b', '#05060e'], n: 22 },
  { id: 'simon', href: 'simon.html', t: 'Demetrius Says', d: 'Watch the colors flash, then repeat the pattern. It gets longer every round.', i: '🎨', cat: 'demetrius', tags: [], c: ['#ff5a5a', '#60a5fa'], n: 21 },
  { id: 'pong', href: 'pong.html', t: 'Pong', d: 'Play the computer or a friend on the same keyboard or phone. First to 7 wins.', i: '🏓', cat: 'arcade', tags: ['2P'], c: ['#f472b6', '#60a5fa'], n: 20 },
  { id: 'reaction', href: 'reaction.html', t: 'Shock Reflex', d: 'Wait for Demetrius to pop up, then click as fast as you can. How fast are your reflexes?', i: '⚡', cat: 'demetrius', tags: [], c: ['#1d7a3a', '#8a1a1a'], n: 19 },
  { id: 'minesweeper', href: 'minesweeper.html', t: 'Minesweeper', d: 'Clear the board without hitting a mine. Easy, medium and hard boards.', i: '💣', cat: 'puzzle', tags: [], c: ['#64748b', '#1e293b'], n: 18 },
  { id: 'breakout', href: 'breakout.html', t: 'Breakout', d: 'Smash every brick across 8 levels. Catch power-ups for a wide paddle, extra balls and lives.', i: '🧱', cat: 'arcade', tags: [], c: ['#f97316', '#7c2d12'], n: 17 },
  { id: 'clicker', href: 'clicker.html', t: 'Demetrius Clicker', d: 'Click to shock him. Buy upgrades. Build a planet of shocked orangutans. Progress saves.', i: '👆', cat: 'demetrius', tags: [], c: ['#c1561e', '#4a1d06'], n: 16 },
  { id: 'whack', href: 'whack.html', t: 'Whack-a-Demetrius', d: '30 seconds. Bonk him when he pops up, build combos, and dodge the bombs.', i: '🔨', cat: 'demetrius', tags: [], c: ['#84cc16', '#3f6212'], n: 15 },
  { id: '2048', href: '2048.html', t: '2048', d: 'Slide and merge matching tiles. Can you reach 2048?', i: '🔢', cat: 'puzzle', tags: [], c: ['#edc22e', '#8f7a66'], n: 14 },
  { id: 'flappy', href: 'flappy.html', t: 'Flappy Demetrius', d: 'His shocked face flies through the zoo cages. Tap to flap. Every tap, he gasps.', i: '🪽', cat: 'demetrius', tags: [], c: ['#38bdf8', '#0f766e'], n: 13 },
  { id: 'snake', href: 'snake.html', t: 'Snake Deluxe', d: 'The upgraded Snake: golden apples, speed modes, wrap-around walls, particles and sound.', i: '🐍', cat: 'arcade', tags: [], c: ['#4ade80', '#14532d'], n: 12 },
  { id: 'stack', href: 'stack.html', t: 'Stack Tower', d: 'Drop sliding blocks to build the tallest tower. Line them up perfectly for bonuses.', i: '🏗️', cat: 'arcade', tags: ['NEW'], c: ['#f59e0b', '#7c3aed'], n: 29 },
  { id: 'connerclicker', href: 'connerclicker.html', t: 'Conner Clicker', d: 'Locked. Click Conner to make him stare, buy upgrades, build Planet Conner. Needs the password.', i: '🔒', cat: 'demetrius', tags: ['NEW'], c: ['#2f7bff', '#0b1d3f'], n: 30 },
  { id: 'tungconner', href: 'tungconner.html', t: 'Tung Tung Conner', d: 'Locked. Bonk the sahur drum with a bat, chain 9 TUNGs for a SAHUR bonus, buy drummers. Needs the password.', i: '🔒', cat: 'demetrius', tags: ['NEW'], c: ['#ffb547', '#2a1748'], n: 31 },
  { id: 'conner', href: 'conner.html', t: "Five Nights at Conner's", d: 'Locked. Survive five nights at the school while Conner hunts you. Needs the password.', i: '🔒', cat: 'demetrius', tags: ['NEW', 'SCARY'], c: ['#1d5fc4', '#000000'], n: 28 },
  { id: 'fnad2', href: 'fnad2.html', t: 'Five Nights at Demetrius 2', d: 'The Lure. Play sounds on the cameras to lead him away. Doors overheat, systems break, vents are open.', i: '🔊', cat: 'demetrius', tags: ['SCARY'], c: ['#450a0a', '#000000'], n: 11 },
  { id: 'dontlook', href: 'dontlook.html', t: "Don't Look At Demetrius", d: "Lost in the dark zoo with a flashlight. He only moves when you can't see him... and you have to blink.", i: '👁️', cat: 'demetrius', tags: ['SCARY', '3D'], c: ['#1c1917', '#000000'], n: 10 },
  { id: 'fnad', href: 'fnad.html', t: 'Five Nights at Demetrius', d: "Survive 12 AM to 6 AM. Watch the cameras. Close the doors. Don't let him get close to your face.", i: '🐒', cat: 'demetrius', tags: ['SCARY'], c: ['#7f1d1d', '#000000'], n: 9 },
  { id: 'hog', href: 'hog.html', t: 'Hog Wild 3000', d: 'A fully 3D pig dodges tractors and hay in the dumbest, most dramatic farm race ever.', i: '🐖', cat: 'arcade', tags: ['3D'], c: ['#f9a8d4', '#be185d'], n: 8 },
  { id: 'pig', href: 'pig.html', t: 'Pig Run', d: 'Race through the farm as a muddy pig. Jump hay bales and fences, grab apples.', i: '🐷', cat: 'arcade', tags: [], c: ['#fda4af', '#65a30d'], n: 7 },
  { id: 'ttt', href: '#ttt', t: 'Tic-Tac-Toe', d: 'Play against the computer or a friend. Three in a row wins.', i: '❌', cat: 'puzzle', tags: ['2P'], c: ['#60a5fa', '#f472b6'], n: 2 },
  { id: 'memory', href: '#memory', t: 'Memory Match', d: 'Flip cards and find all the matching pairs in as few moves as you can.', i: '🃏', cat: 'puzzle', tags: [], c: ['#a78bfa', '#4c1d95'], n: 1 }
];
const CHIPS = [['all', 'All'], ['fav', '⭐ Favorites'], ['arcade', '🕹️ Arcade'], ['puzzle', '🧩 Puzzle'], ['demetrius', '🐒 Demetrius'], ['multi', '👥 With friends']];
let filter = 'all', query = '', favs = loadJ('gr_favs', []);
const plays = id => parseInt(load('gr_open_' + id) || '0', 10);
function opened(id) { save('gr_open_' + id, String(plays(id) + 1)); }
function matches(g) {
  if (query && (g.t + ' ' + g.d + ' ' + g.cat).toLowerCase().indexOf(query.toLowerCase()) < 0) return false;
  if (filter === 'fav') return favs.indexOf(g.id) >= 0;
  if (filter === 'multi') return g.tags.indexOf('2P') >= 0 || g.tags.indexOf('ONLINE') >= 0;
  if (filter !== 'all') return g.cat === filter;
  return true;
}
function render() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  const list = GAMES.filter(matches).sort((a, b) => (favs.indexOf(b.id) >= 0) - (favs.indexOf(a.id) >= 0) || b.n - a.n);
  for (const g of list) {
    const a = document.createElement('a'); a.className = 'card'; a.href = g.href; a.title = g.d; a.style.setProperty('--c', g.c[0]);
    const ic = document.createElement('div'); ic.className = 'ic'; ic.textContent = g.i; ic.style.background = 'linear-gradient(135deg,' + g.c[0] + ',' + g.c[1] + ')';
    const h = document.createElement('h4'); h.textContent = g.t;
    const sm = document.createElement('small'); const n = plays(g.id);
    sm.textContent = g.tags.indexOf('NEW') >= 0 && !n ? '✨ New' : g.tags.indexOf('ONLINE') >= 0 ? '🌐 Online' : g.tags.indexOf('2P') >= 0 ? '👥 2 players' : (n ? 'Played ' + n + 'x' : '');
    const f = document.createElement('button'); const isFav = favs.indexOf(g.id) >= 0; f.className = 'fav' + (isFav ? ' on' : ''); f.textContent = isFav ? '⭐' : '☆'; f.setAttribute('aria-label', 'Favorite ' + g.t);
    f.onclick = e => { e.preventDefault(); e.stopPropagation(); const k = favs.indexOf(g.id); if (k >= 0) favs.splice(k, 1); else favs.push(g.id); save('gr_favs', JSON.stringify(favs)); render(); };
    a.append(f, ic, h, sm);
    a.addEventListener('click', e => { opened(g.id); if (g.href[0] === '#') { e.preventDefault(); show(g.id); } });
    grid.appendChild(a);
  }
  const em = document.getElementById('empty');
  em.style.display = list.length ? 'none' : 'block';
  em.textContent = filter === 'fav' && !query ? 'No favorites yet. Tap the ☆ on a game.' : 'No games found.';
  const ch = document.getElementById('chips'); ch.innerHTML = '';
  CHIPS.forEach(([id, label]) => { const b = document.createElement('button'); b.className = 'chip' + (filter === id ? ' on' : ''); b.textContent = label; b.onclick = () => { filter = id; render(); }; ch.appendChild(b); });
  document.getElementById('foot').textContent = 'GAME ROOM · ' + GAMES.length + ' games';
}
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
window.addEventListener('pageshow', render);

// name
function showName() { document.getElementById('meName').textContent = window.GR ? GR.name() : 'Guest'; }
function askName() { const m = document.getElementById('nameModal'); m.classList.add('on'); const i = document.getElementById('nameIn'); i.value = window.GR && GR.hasName() ? GR.name() : ''; setTimeout(() => i.focus(), 50); }
document.getElementById('nameOk').onclick = () => { const v = document.getElementById('nameIn').value.trim(); if (!v) { document.getElementById('nameIn').focus(); return; } if (window.GR) GR.setName(v); document.getElementById('nameModal').classList.remove('on'); showName(); };
document.getElementById('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('nameOk').click(); });
document.getElementById('meBtn').onclick = askName;
showName(); if (window.GR && !GR.hasName()) askName();

// secret: tap the title 5 times quickly to open the admin panel
let taps = [];
document.getElementById('logo').addEventListener('click', () => { const now = Date.now(); taps = taps.filter(t => now - t < 2500); taps.push(now); if (taps.length >= 5) location.href = 'admin.html'; });

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'memory' && !Memory.started) Memory.start();
  if (id === 'home') { render(); if (location.hash) history.replaceState(null, '', location.pathname); }
  else history.replaceState(null, '', '#' + id);
  window.dispatchEvent(new HashChangeEvent('hashchange'));
  window.scrollTo(0, 0);
}

const TTT = (() => {
  const boardEl = document.getElementById('tttBoard');
  const msg = document.getElementById('tttMsg');
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  let board, turn, done, mode = 'cpu';
  const tally = { X: 0, O: 0, D: 0 };
  const cells = [];
  for (let i = 0; i < 9; i++) { const b = document.createElement('button'); b.onclick = () => play(i); boardEl.appendChild(b); cells.push(b); }
  function winner(bd) {
    for (const l of lines) if (bd[l[0]] && bd[l[0]] === bd[l[1]] && bd[l[1]] === bd[l[2]]) return { p: bd[l[0]], line: l };
    return bd.every(Boolean) ? { p: 'D' } : null;
  }
  function render() { cells.forEach((c, i) => { c.textContent = board[i] || ''; c.className = board[i] ? board[i].toLowerCase() : ''; }); }
  function finish(w) {
    done = true;
    if (w.p === 'D') { tally.D++; msg.textContent = "It's a draw!"; }
    else { tally[w.p]++; w.line.forEach(i => cells[i].classList.add('win')); msg.textContent = mode === 'cpu' ? (w.p === 'X' ? 'You win! 🎉' : 'Computer wins!') : w.p + ' wins! 🎉'; }
    document.getElementById('tttX').textContent = tally.X; document.getElementById('tttO').textContent = tally.O; document.getElementById('tttD').textContent = tally.D;
  }
  function minimax(bd, player) {
    const w = winner(bd);
    if (w) return { score: w.p === 'O' ? 10 : w.p === 'X' ? -10 : 0 };
    const moves = [];
    bd.forEach((v, i) => { if (v) return; bd[i] = player; moves.push({ i, score: minimax(bd, player === 'O' ? 'X' : 'O').score }); bd[i] = null; });
    return moves.reduce((best, m) => (player === 'O' ? m.score > best.score : m.score < best.score) ? m : best);
  }
  function cpuMove() {
    const empty = board.map((v, i) => v ? null : i).filter(v => v !== null);
    const pick = Math.random() < 0.2 ? empty[Math.floor(Math.random() * empty.length)] : minimax(board.slice(), 'O').i;
    board[pick] = 'O'; render();
    const w = winner(board); if (w) return finish(w);
    turn = 'X'; msg.textContent = 'Your turn (X)';
  }
  function play(i) {
    if (done || board[i] || (mode === 'cpu' && turn === 'O')) return;
    board[i] = turn; render();
    const w = winner(board); if (w) return finish(w);
    turn = turn === 'X' ? 'O' : 'X';
    if (mode === 'cpu') { msg.textContent = 'Computer is thinking...'; setTimeout(cpuMove, 350); }
    else msg.textContent = turn + "'s turn";
  }
  function reset() { board = Array(9).fill(null); turn = 'X'; done = false; render(); msg.textContent = mode === 'cpu' ? 'Your turn (X)' : "X's turn"; }
  function setMode(m) {
    mode = m; tally.X = tally.O = tally.D = 0;
    ['tttX', 'tttO', 'tttD'].forEach(id => document.getElementById(id).textContent = 0);
    document.getElementById('modeCpu').classList.toggle('on', m === 'cpu'); document.getElementById('modePvp').classList.toggle('on', m === 'pvp');
    reset();
  }
  reset();
  return { reset, setMode };
})();

const Memory = (() => {
  const boardEl = document.getElementById('memBoard');
  const msg = document.getElementById('memMsg');
  const emojis = ['🍕','🚀','🐶','🎸','🌈','⚽','🍩','👾'];
  let first = null, lock = false, moves = 0, matched = 0, secs = 0, clock = null;
  let best = load('memBest');
  if (best) document.getElementById('memBest').textContent = best + ' moves';
  function start() {
    Memory.started = true; clearInterval(clock); clock = null;
    first = null; lock = false; moves = 0; matched = 0; secs = 0;
    document.getElementById('memMoves').textContent = 0; document.getElementById('memTime').textContent = '0s'; msg.textContent = '';
    const deck = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
    boardEl.innerHTML = '';
    deck.forEach(e => { const t = document.createElement('button'); t.className = 'tile'; t.textContent = e; t.dataset.v = e; t.onclick = () => flip(t); boardEl.appendChild(t); });
  }
  function flip(t) {
    if (lock || t === first || t.classList.contains('done')) return;
    if (!clock) clock = setInterval(() => { secs++; document.getElementById('memTime').textContent = secs + 's'; }, 1000);
    t.classList.add('flip');
    if (!first) { first = t; return; }
    moves++; document.getElementById('memMoves').textContent = moves;
    if (first.dataset.v === t.dataset.v) { first.classList.add('done'); t.classList.add('done'); first = null; matched++; if (matched === emojis.length) win(); }
    else { lock = true; const a = first; first = null; setTimeout(() => { a.classList.remove('flip'); t.classList.remove('flip'); lock = false; }, 800); }
  }
  function win() {
    clearInterval(clock); clock = null;
    msg.textContent = 'You found them all in ' + moves + ' moves and ' + secs + 's! 🎉';
    if (!best || moves < parseInt(best, 10)) { best = moves; save('memBest', moves); document.getElementById('memBest').textContent = moves + ' moves'; }
  }
  return { start, started: false };
})();


render();
if (location.hash === '#ttt' || location.hash === '#memory') show(location.hash.slice(1));
</script>
