<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Deluxe · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1020; color: #f2f3ff; font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 16px 12px 32px; }
  .wrap { max-width: 560px; margin: 0 auto; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  a.back { color: #f2f3ff; background: #24274a; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; }
  h1 { font-family: 'Press Start 2P', monospace; font-size: 18px; color: #4ade80; }
  .stats { display: flex; justify-content: center; gap: 18px; margin: 8px 0 12px; font-weight: 700; color: #9aa0c7; }
  .stats b { color: #ffcc33; }
  canvas { width: 100%; max-width: 520px; aspect-ratio: 1; border-radius: 14px; border: 3px solid #24274a; background: #0a0b17; touch-action: none; display: block; margin: 0 auto; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .row button { background: #24274a; color: #f2f3ff; border: 2px solid transparent; border-radius: 10px; padding: 8px 14px; font: 700 14px Rubik, sans-serif; cursor: pointer; }
  .row button.on { border-color: #4ade80; color: #4ade80; }
  .help { color: #9aa0c7; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>SNAKE DELUXE</h1><span></span></div>
  <div class="stats"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Length <b id="len">3</b></span></div>
  <canvas id="c" width="520" height="520"></canvas>
  <div class="row" id="speeds"><button data-s="150">Chill</button><button data-s="110" class="on">Normal</button><button data-s="75">Fast</button><button data-s="50">Insane</button></div>
  <div class="row"><button id="wrapBtn">Walls: ON</button></div>
  <p class="help">Arrows / WASD or swipe · Space to pause · 🍎 = 1 · ⭐ golden apple = 5 (it disappears fast!)</p>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const N = 20, S = cv.width / N;
  const $ = id => document.getElementById(id);
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  save('gr_plays_snake', String(parseInt(load('gr_plays_snake') || '0', 10) + 1));
  let speed = 110, walls = true, best = parseInt(load('snake2Best') || '0', 10);
  $('best').textContent = best;
  let body, dir, queue, food, gold, score, state = 'ready', acc = 0, last = 0, particles = [], shake = 0;
  let ac = null;
  function beep(f, d, type, vol) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + d);
      g.gain.setValueAtTime(vol || 0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
    } catch (e) {}
  }
  function free() {
    let p;
    do { p = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; }
    while (body.some(b => b.x === p.x && b.y === p.y) || (food && food.x === p.x && food.y === p.y));
    return p;
  }
  function reset() {
    body = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 }; queue = []; score = 0; food = null; food = free(); gold = null; particles = [];
    $('score').textContent = 0; $('len').textContent = 3;
  }
  function burst(x, y, color) { for (let i = 0; i < 14; i++) particles.push({ x: x * S + S / 2, y: y * S + S / 2, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1, color }); }
  function step() {
    if (queue.length) { const d = queue.shift(); if (d.x !== -dir.x || d.y !== -dir.y) dir = d; }
    let h = { x: body[0].x + dir.x, y: body[0].y + dir.y };
    if (!walls) { h.x = (h.x + N) % N; h.y = (h.y + N) % N; }
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.slice(0, -1).some(b => b.x === h.x && b.y === h.y)) return die();
    body.unshift(h);
    let grow = false;
    if (h.x === food.x && h.y === food.y) { score += 1; grow = true; burst(h.x, h.y, '#ff5a5a'); beep(520, 0.08); food = free(); if (!gold && Math.random() < 0.18) gold = { ...free(), t: 6 }; }
    if (gold && h.x === gold.x && h.y === gold.y) { score += 5; grow = true; burst(h.x, h.y, '#ffd34a'); beep(880, 0.15, 'triangle', 0.1); gold = null; body.push({ ...body[body.length - 1] }, { ...body[body.length - 1] }); }
    if (!grow) body.pop();
    $('score').textContent = score; $('len').textContent = body.length;
  }
  function die() {
    state = 'over'; shake = 12; beep(140, 0.4, 'sawtooth', 0.12);
    body.forEach((b, i) => { if (i % 2 === 0) burst(b.x, b.y, '#4ade80'); });
    if (score > best) { best = score; save('snake2Best', best); $('best').textContent = best; }
  }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.fill(); }
  function draw(t) {
    ctx.save();
    if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.9; if (shake < 0.5) shake = 0; }
    ctx.fillStyle = '#0a0b17'; ctx.fillRect(-20, -20, cv.width + 40, cv.height + 40);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if ((x + y) % 2) { ctx.fillStyle = '#0e1022'; ctx.fillRect(x * S, y * S, S, S); }
    if (walls) { ctx.strokeStyle = '#3a2a6a'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, cv.width - 4, cv.height - 4); }
    // food
    const pulse = 1 + Math.sin(t / 150) * 0.08;
    ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(food.x * S + S / 2, food.y * S + S / 2 + 1, S * 0.36 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4ade80'; ctx.beginPath(); ctx.ellipse(food.x * S + S / 2 + 4, food.y * S + 5, 4, 2, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(food.x * S + S / 2 - 4, food.y * S + S / 2 - 3, 3, 0, Math.PI * 2); ctx.fill();
    if (gold) {
      const a = Math.min(1, gold.t / 1.5);
      ctx.globalAlpha = gold.t < 2 && Math.floor(t / 120) % 2 ? 0.3 : 1;
      ctx.fillStyle = '#ffd34a'; ctx.font = (S * 0.9) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⭐', gold.x * S + S / 2, gold.y * S + S / 2 + 1); ctx.globalAlpha = 1;
    }
    // snake: gradient body, rounded, with eyes
    body.forEach((b, i) => {
      const k = i / Math.max(1, body.length - 1);
      const g = Math.round(222 - k * 90), r = Math.round(74 - k * 30);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + Math.round(128 - k * 40) + ')';
      const pad = i === 0 ? 1 : 2 + k * 2;
      rr(b.x * S + pad, b.y * S + pad, S - pad * 2, S - pad * 2, 7);
    });
    const h = body[0];
    const ex = dir.x, ey = dir.y;
    [[-1], [1]].forEach(([s]) => {
      const cx = h.x * S + S / 2 + ex * 5 + (ey ? s * 6 : 0), cy = h.y * S + S / 2 + ey * 5 + (ex ? s * 6 : 0);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx + ex * 1.5, cy + ey * 1.5, 2.2, 0, Math.PI * 2); ctx.fill();
    });
    particles.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - 3, p.y - 3, 6, 6); });
    ctx.globalAlpha = 1;
    ctx.restore();
    if (state !== 'run') {
      ctx.fillStyle = 'rgba(10,11,23,.7)'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = '#ffcc33'; ctx.font = '22px "Press Start 2P", monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(state === 'over' ? 'GAME OVER' : state === 'paused' ? 'PAUSED' : 'SNAKE', cv.width / 2, cv.height / 2 - 24);
      ctx.fillStyle = '#f2f3ff'; ctx.font = '700 17px Rubik, sans-serif';
      ctx.fillText(state === 'over' ? 'Score ' + score + ' · press Space or tap' : 'Press Space or tap to play', cv.width / 2, cv.height / 2 + 20);
    }
  }
  function loop(t) {
    const dt = last ? t - last : 16; last = t;
    if (state === 'run') {
      acc += dt;
      const sp = Math.max(speed * 0.6, speed - Math.floor(score / 5) * 4);
      while (acc >= sp && state === 'run') { acc -= sp; step(); }
      if (gold) { gold.t -= dt / 1000; if (gold.t <= 0) gold = null; }
    }
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt / 600; });
    particles = particles.filter(p => p.life > 0);
    draw(t);
    requestAnimationFrame(loop);
  }
  function go() { if (state === 'run') { state = 'paused'; return; } if (state !== 'paused') reset(); state = 'run'; acc = 0; beep(400, 0.06); }
  function turn(x, y) { if (state !== 'run') return; const lastD = queue.length ? queue[queue.length - 1] : dir; if (x === -lastD.x && y === -lastD.y) return; if (x === lastD.x && y === lastD.y) return; if (queue.length < 3) queue.push({ x, y }); }
  document.addEventListener('keydown', e => {
    const m = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[e.key.toLowerCase()];
    if (m) { e.preventDefault(); if (state !== 'run') go(); turn(m[0], m[1]); }
    if (e.key === ' ') { e.preventDefault(); go(); }
  });
  let tx = 0, ty = 0;
  cv.addEventListener('pointerdown', e => { tx = e.clientX; ty = e.clientY; });
  cv.addEventListener('pointerup', e => {
    const dx = e.clientX - tx, dy = e.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { if (state !== 'run') go(); return; }
    Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
  });
  document.querySelectorAll('#speeds button').forEach(b => b.addEventListener('click', () => { speed = +b.dataset.s; document.querySelectorAll('#speeds button').forEach(x => x.classList.toggle('on', x === b)); b.blur(); }));
  $('wrapBtn').addEventListener('click', e => { walls = !walls; e.target.textContent = 'Walls: ' + (walls ? 'ON' : 'OFF (wrap around)'); e.target.blur(); });
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
