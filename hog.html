<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hog Wild 3000 · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1020;
    --panel: #1a1c35;
    --panel-2: #24274a;
    --text: #f2f3ff;
    --muted: #9aa0c7;
    --accent: #ffcc33;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 16px 12px 32px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }
  .btn { background: var(--accent); color: #1a1300; border: none; border-radius: 10px; padding: 10px 18px; font: 700 15px 'Rubik', system-ui, sans-serif; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn.ghost { background: var(--panel-2); color: var(--text); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #game { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 78vh; border-radius: 16px; overflow: hidden; border: 4px solid #ff4fa3; box-shadow: 0 0 0 4px #ffd23f, 0 10px 40px rgba(255,79,163,.35); background: #8fd3ff; touch-action: none; user-select: none; -webkit-user-select: none; }
  @media (max-width: 640px) { #game { aspect-ratio: 3 / 4; } }
  #game canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Bungee', 'Rubik', sans-serif; }
  .score { position: absolute; top: 12px; left: 14px; font-size: clamp(18px, 3.4vw, 30px); color: #fff; -webkit-text-stroke: 2px #2b0a3d; paint-order: stroke fill; text-shadow: 3px 3px 0 #ff4fa3; line-height: 1.15; }
  .score small { display: block; font-size: .6em; color: #ffd23f; }
  .mute { position: absolute; top: 10px; right: 12px; pointer-events: auto; background: rgba(43,10,61,.7); color: #fff; border: 2px solid #ffd23f; border-radius: 10px; font: 700 14px 'Rubik', sans-serif; padding: 6px 10px; cursor: pointer; }

  .shout { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-family: 'Bungee Shade', 'Bungee', sans-serif; font-size: clamp(26px, 6vw, 64px); color: #ffd23f; -webkit-text-stroke: 2px #2b0a3d; text-shadow: 4px 4px 0 #ff4fa3, 8px 8px 0 #2b0a3d; white-space: nowrap; animation: pop 1.3s ease-out forwards; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(-20deg); opacity: 0; }
    15% { transform: translate(-50%, -50%) scale(1.25) rotate(6deg); opacity: 1; }
    30% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    80% { opacity: 1; }
    100% { transform: translate(-50%, -80%) scale(1.05) rotate(-3deg); opacity: 0; }
  }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; background: radial-gradient(circle at 50% 40%, rgba(255,79,163,.55), rgba(43,10,61,.85)); pointer-events: auto; }
  .logo { font-family: 'Bungee Shade', 'Bungee', sans-serif; font-size: clamp(34px, 9vw, 92px); line-height: .95; color: #ffd23f; text-shadow: 5px 5px 0 #ff4fa3, 10px 10px 0 #2b0a3d; transform: rotate(-4deg); animation: wobble 2.2s ease-in-out infinite; }
  .logo span { display: block; font-size: .55em; color: #7cf7ff; }
  @keyframes wobble { 0%,100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(3deg) scale(1.06); } }
  .tag { font-family: 'Bungee', sans-serif; color: #fff; font-size: clamp(12px, 2.2vw, 18px); letter-spacing: 1px; }
  .tag em { display: block; font-family: 'Rubik', sans-serif; font-style: normal; font-size: .7em; color: #ffd6ec; margin-top: 4px; letter-spacing: 0; }
  .go { font-family: 'Bungee', sans-serif; font-size: clamp(18px, 3vw, 26px); background: #ffd23f; color: #2b0a3d; border: 4px solid #2b0a3d; border-radius: 14px; padding: 12px 28px; cursor: pointer; box-shadow: 5px 5px 0 #2b0a3d; animation: pulse 1s ease-in-out infinite; }
  .go:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #2b0a3d; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  .keys { color: #ffe9f5; font-size: clamp(12px, 1.8vw, 15px); max-width: 520px; }
  .big { font-family: 'Bungee', sans-serif; font-size: clamp(16px, 3vw, 26px); color: #fff; }
  .big b { color: #ffd23f; }
  .quip { font-family: 'Bungee', sans-serif; color: #7cf7ff; font-size: clamp(14px, 2.4vw, 20px); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .logo, .go { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="btn ghost" href="index.html">← Back</a>
    <span style="color:var(--muted);font-size:14px">Arrows / WASD or swipe</span>
  </div>

  <div id="game">
    <div class="hud">
      <div class="score"><span id="meters">0 m</span><small id="appleCount">🍎 0</small></div>
      <button class="mute" id="mute">🔊 Sound</button>
      <div id="shouts"></div>
    </div>

    <div class="screen" id="title">
      <div class="logo">HOG WILD<span>3000</span></div>
      <div class="tag">THE MOST REALISTIC PIG GAME EVER MADE*<em>*this is not true</em></div>
      <button class="go" id="start">PRESS START</button>
      <div class="keys">← → change lanes · ↑ or Space to jump (with a flip) · ↓ to belly-slide<br>On a phone: swipe left, right, up or down</div>
    </div>

    <div class="screen" id="over" hidden>
      <div class="logo" style="font-size:clamp(28px,7vw,70px)">OINK OVER</div>
      <div class="quip" id="quip"></div>
      <div class="big">SCORE <b id="finalScore">0</b> · BEST <b id="bestScore">0</b></div>
      <button class="go" id="again">OINK AGAIN</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const host = document.getElementById('game');
  const $ = id => document.getElementById(id);
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  let best = parseInt(load('hogBest') || '0', 10);

  // ================= AUDIO (all synthesized, no files) =================
  let ac = null, master = null, muted = load('hogMute') === '1';
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function setMute(m) { muted = m; save('hogMute', m ? '1' : '0'); if (master) master.gain.value = m ? 0 : 0.6; $('mute').textContent = m ? '🔇 Muted' : '🔊 Sound'; }
  setMute(muted);
  $('mute').addEventListener('click', e => { e.stopPropagation(); audio(); setMute(!muted); });

  function grunt(t, f0, f1, dur, vol) {
    const o = ac.createOscillator(), g = ac.createGain(), bp = ac.createBiquadFilter(), lp = ac.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    bp.type = 'bandpass'; bp.frequency.value = 850; bp.Q.value = 3;
    lp.type = 'lowpass'; lp.frequency.value = 2200;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    // wobble for a snorty texture
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 38; lg.gain.value = 40; lfo.connect(lg); lg.connect(o.frequency);
    o.connect(bp); bp.connect(lp); lp.connect(g); g.connect(master);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);
  }
  function oink() { if (!audio()) return; const t = ac.currentTime; grunt(t, 240, 150, 0.13, 0.5); grunt(t + 0.16, 260, 140, 0.16, 0.55); }
  function squeal() { if (!audio()) return; const t = ac.currentTime; grunt(t, 500, 900, 0.25, 0.5); grunt(t + 0.25, 900, 380, 0.6, 0.5); }
  function ding(n) {
    if (!audio()) return; const t = ac.currentTime;
    [880, 1320].forEach((f, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f * (1 + Math.min(n, 10) * 0.03); g.gain.setValueAtTime(0.12, t + i * 0.07); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.07 + 0.12); o.connect(g); g.connect(master); o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.15); });
  }
  function thud() {
    if (!audio()) return; const t = ac.currentTime;
    const len = ac.sampleRate * 0.4, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = ac.createBufferSource(), g = ac.createGain(), lp = ac.createBiquadFilter();
    s.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = 600; g.gain.value = 0.9;
    s.connect(lp); lp.connect(g); g.connect(master); s.start(t);
  }
  // cheesy game-show music loop
  let musicTimer = null, nextNote = 0, step = 0;
  const bassLine = [110, 110, 165, 110, 147, 110, 165, 196];
  const lead = [440, 0, 554, 659, 0, 554, 440, 0, 494, 0, 587, 740, 0, 587, 494, 0];
  function note(f, t, type, vol, dur) { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02); }
  function startMusic() {
    if (!audio() || musicTimer) return;
    nextNote = ac.currentTime + 0.05; step = 0;
    musicTimer = setInterval(() => {
      while (nextNote < ac.currentTime + 0.15) {
        note(bassLine[step % 8], nextNote, 'triangle', 0.18, 0.18);
        const l = lead[step % 16]; if (l) note(l, nextNote, 'square', 0.04, 0.12);
        nextNote += 0.15; step++;
      }
    }, 40);
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

  // ================= THREE.JS SETUP =================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  host.insertBefore(renderer.domElement, host.firstChild);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3ff);
  scene.fog = new THREE.Fog(0xbfe6ff, 40, 95);
  const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);
  const camBase = new THREE.Vector3(0, 3.6, 7.2);
  camera.position.copy(camBase);

  scene.add(new THREE.HemisphereLight(0xdff3ff, 0x6b8a3a, 0.75));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.15);
  sun.position.set(6, 12, 4); sun.target.position.set(0, 0, -4);
  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 });
  scene.add(sun, sun.target);

  function resize() {
    const w = host.clientWidth, h = host.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 1 ? 78 : 62;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  // ---------- canvas textures ----------
  function canvasTex(size, draw, repX, repY) {
    const c = document.createElement('canvas'); c.width = c.height = size;
    draw(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repX || 1, repY || 1);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = 4;
    return t;
  }
  function speckle(g, s, n, colors, rmax) { for (let i = 0; i < n; i++) { g.fillStyle = colors[i % colors.length]; g.beginPath(); g.arc(Math.random() * s, Math.random() * s, Math.random() * rmax + 0.5, 0, Math.PI * 2); g.fill(); } }

  const dirtTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#9b7146'; g.fillRect(0, 0, s, s);
    speckle(g, s, 900, ['rgba(70,45,25,.45)', 'rgba(190,150,105,.45)', 'rgba(120,85,50,.5)'], 2.2);
    g.fillStyle = 'rgba(70,45,25,.18)';
    [s * 0.17, s * 0.5, s * 0.83].forEach(x => g.fillRect(x - 8, 0, 16, s)); // worn wheel ruts per lane
  }, 1, 40);
  const grassTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#5fae3c'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 1600; i++) { g.strokeStyle = ['#4f9a30', '#74c24c', '#3f8726', '#86d35a'][i % 4]; g.lineWidth = 1.2; const x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.random() * 3 - 1.5, y - 4 - Math.random() * 5); g.stroke(); }
  }, 8, 40);
  const hayTex = canvasTex(128, (g, s) => {
    g.fillStyle = '#e2bb5c'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 500; i++) { g.strokeStyle = ['#c99a3a', '#f3d580', '#b98a2e'][i % 3]; g.lineWidth = 1; const x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 10 + Math.random() * 10, y + Math.random() * 4 - 2); g.stroke(); }
    g.fillStyle = '#8a4b26'; g.fillRect(s * 0.28, 0, 5, s); g.fillRect(s * 0.68, 0, 5, s);
  });
  // pig skin: pale pink, subtle blotches, grey patches, fine bristles
  const skinTex = canvasTex(512, (g, s) => {
    g.fillStyle = '#f2c4b8'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 60; i++) { const r = 20 + Math.random() * 60; const gr = g.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, 'rgba(230,160,150,.25)'); gr.addColorStop(1, 'rgba(230,160,150,0)'); g.save(); g.translate(Math.random() * s, Math.random() * s); g.fillStyle = gr; g.fillRect(-r, -r, r * 2, r * 2); g.restore(); }
    [[0.18, 0.35, 70], [0.3, 0.55, 45], [0.72, 0.4, 55]].forEach(([x, y, r]) => { const gr = g.createRadialGradient(x * s, y * s, r * 0.3, x * s, y * s, r); gr.addColorStop(0, 'rgba(105,110,125,.6)'); gr.addColorStop(1, 'rgba(105,110,125,0)'); g.fillStyle = gr; g.beginPath(); g.arc(x * s, y * s, r, 0, Math.PI * 2); g.fill(); });
    for (let i = 0; i < 2500; i++) { g.strokeStyle = 'rgba(255,240,230,.35)'; g.lineWidth = 0.6; const x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y + 4); g.stroke(); }
    speckle(g, s, 180, ['rgba(120,85,55,.25)'], 3); // a bit of mud
  });
  const bumpTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
    speckle(g, s, 3000, ['#6a6a6a', '#9a9a9a'], 1.4);
  });
  bumpTex.encoding = THREE.LinearEncoding;

  // ---------- ground ----------
  const road = new THREE.Mesh(new THREE.PlaneGeometry(7, 200), new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 }));
  road.rotation.x = -Math.PI / 2; road.position.z = -90; road.receiveShadow = true; scene.add(road);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(80, 200), new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
  grass.rotation.x = -Math.PI / 2; grass.position.set(0, -0.02, -90); grass.receiveShadow = true; scene.add(grass);

  // far hills + smiling sun (it's that kind of game)
  const hillMat = new THREE.MeshStandardMaterial({ color: 0x6fbf4a, roughness: 1, flatShading: true });
  [[-30, -90, 16], [-10, -110, 20], [18, -100, 18], [40, -85, 14], [0, -130, 26]].forEach(([x, z, r]) => { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), hillMat); m.position.set(x, -r * 0.55, z); scene.add(m); });
  const sunTex = canvasTex(256, (g, s) => {
    g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(s / 2, s / 2, s * 0.42, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#ffb000'; g.lineWidth = 8; g.stroke();
    g.fillStyle = '#2b0a3d'; g.beginPath(); g.arc(s * 0.38, s * 0.42, 12, 0, Math.PI * 2); g.arc(s * 0.62, s * 0.42, 12, 0, Math.PI * 2); g.fill();
    g.lineWidth = 9; g.strokeStyle = '#2b0a3d'; g.beginPath(); g.arc(s / 2, s * 0.52, s * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    g.fillStyle = 'rgba(255,90,140,.55)'; g.beginPath(); g.arc(s * 0.3, s * 0.56, 16, 0, Math.PI * 2); g.arc(s * 0.7, s * 0.56, 16, 0, Math.PI * 2); g.fill();
  });
  const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTex, fog: false }));
  sunSprite.scale.set(16, 16, 1); sunSprite.position.set(22, 26, -120); scene.add(sunSprite);

  // fence rails (static) along both sides
  const woodMat = new THREE.MeshStandardMaterial({ color: 0xa47a4f, roughness: 0.9 });
  [-4, 4].forEach(x => { [0.55, 1.0].forEach(y => { const r = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 200), woodMat); r.position.set(x, y, -90); scene.add(r); }); });

  // ---------- recycled scenery ----------
  const decor = [];
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 1 });
  const leafMats = [0x3f9a34, 0x4fae3c, 0x2f8a2a].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true }));
  function tree() {
    const g = new THREE.Group();
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2, 8), trunkMat); t.position.y = 1; t.castShadow = true; g.add(t);
    const l = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4, 1), leafMats[Math.floor(Math.random() * 3)]); l.position.y = 2.8; l.castShadow = true; g.add(l);
    g.scale.setScalar(0.9 + Math.random() * 0.7);
    return g;
  }
  function barn() {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(5, 3.4, 4), new THREE.MeshStandardMaterial({ color: 0xb8322a, roughness: 0.8 })); b.position.y = 1.7; g.add(b);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.8, 2, 4), new THREE.MeshStandardMaterial({ color: 0x7a1f1a, roughness: 0.8 })); roof.position.y = 4.4; roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, 0.78); g.add(roof);
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.2, 0.05), new THREE.MeshStandardMaterial({ color: 0xf3ead8 })); door.position.set(0, 1.1, 2.03); g.add(door);
    g.rotation.y = Math.PI / 2;
    return g;
  }
  function post() { const p = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.3, 0.18), woodMat); p.position.y = 0.65; return p; }
  for (let i = 0; i < 30; i++) { const p = post(); p.position.set(-4, 0.65, -i * 4); scene.add(p); decor.push({ o: p, span: 120 }); const q = post(); q.position.set(4, 0.65, -i * 4); scene.add(q); decor.push({ o: q, span: 120 }); }
  for (let i = 0; i < 18; i++) { const t = tree(); const side = i % 2 ? 1 : -1; t.position.set(side * (7 + Math.random() * 14), 0, -i * 7 - Math.random() * 4); scene.add(t); decor.push({ o: t, span: 126 }); }
  [[-11, -40], [12, -95]].forEach(([x, z]) => { const b = barn(); b.position.set(x, 0, z); scene.add(b); decor.push({ o: b, span: 126 }); });

  // ================= THE PIG =================
  const skinMat = new THREE.MeshStandardMaterial({ map: skinTex, bumpMap: bumpTex, bumpScale: 0.015, roughness: 0.55, metalness: 0 });
  const snoutMat = new THREE.MeshStandardMaterial({ color: 0xe99a8c, roughness: 0.45, bumpMap: bumpTex, bumpScale: 0.01 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x241414, roughness: 0.4 });
  const hoofMat = new THREE.MeshStandardMaterial({ color: 0x3a2a22, roughness: 0.6 });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15 });
  const earMat = new THREE.MeshStandardMaterial({ color: 0xeab0a3, roughness: 0.6, side: THREE.DoubleSide });
  const mudMat = new THREE.MeshStandardMaterial({ color: 0x6e4b2e, roughness: 1 });

  const pig = new THREE.Group();     // moves around (lanes, jumps)
  const pigBody = new THREE.Group(); // spins (flips, ragdoll)
  pig.add(pigBody);
  pigBody.position.y = 1.0;          // pivot at body center
  scene.add(pig);
  function shadowy(m) { m.castShadow = true; return m; }

  const torso = shadowy(new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), skinMat));
  torso.scale.set(0.78, 0.72, 1.2); pigBody.add(torso);
  const belly = shadowy(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), skinMat));
  belly.scale.set(0.7, 0.5, 0.95); belly.position.set(0, -0.28, 0.05); pigBody.add(belly);
  const butt = shadowy(new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 16), skinMat));

  // ---------- main loop ----------
  const clock = new THREE.Clock();

    shake = Math.max(0, shake - rawDt * 1.8);
    const followX = state === 'crash' ? pig.position.x * 0.5 : px * 0.55;
    camera.position.set(camBase.x + followX + (Math.random() - 0.5) * shake * 0.6, camBase.y + (Math.random() - 0.5) * shake * 0.6, camBase.z + (state === 'crash' ? Math.min(3, crash.t * 2) : 0));
    camera.lookAt(followX * 0.6, 1.1, state === 'crash' ? pig.position.z - 4 : -5);

    renderer.render(scene, camera);
  }
  // title pose
  pig.rotation.y = Math.PI;
  animate();
})();
</script>
</body>
</html>
