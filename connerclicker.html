      const base2 = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

  const toasts = document.createElement('div'); toasts.id = 'toasts'; document.body.appendChild(toasts);

  function sparks(x, y, n, set) { const r = face.parentElement.getBoundingClientRect(); for (let i = 0; i < n; i++) { const s = document.createElement('div'); s.className = 'spark'; s.textContent = set[Math.floor(Math.random() * set.length)]; s.style.left = (x - r.left - 11) + 'px'; s.style.top = (y - r.top - 11) + 'px'; const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 70; s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px'); face.parentElement.appendChild(s); setTimeout(() => s.remove(), 800); } }

  });

  let friends = {}; try { friends = JSON.parse(load('connerFriends') || '{}') || {}; } catch (e) { friends = {}; }

    $('mlab').textContent = frenzy > 0 ? '🔥 FRENZY! x7 clicks · ' + Math.ceil(frenzy) + 's' : boostT > 0 ? '✨ ' + (boostKind === 'click' ? 'Click' : 'Production') + ' x' + boostK + ' · ' + Math.ceil(boostT) + 's' : 'STARE FRENZY: click fast to fill!';

        if (i === AREAS.length - 1 && S.done) { const c = document.createElement('div'); c.className = 'bossCard'; c.innerHTML = '<div class="bi">👑</div><b>You beat the game!</b><small>Rebirth (Stats tab) to start Tier ' + (tier() + 2) + ': tougher bosses, but everything earns 6x more. Keep climbing the leaderboard!</small>'; el.appendChild(c); }

        '<button class="reb" id="reb"' + (gainC > 0 ? '' : ' disabled') + '>' + (armed ? 'Click again to rebirth!' : '🌀 REBIRTH: +' + fmt(gainC) + ' Conner Coins') + '</button><div class="ml" style="margin-top:6px">Rebirth sends you back to Classroom 114 with no stares or buildings, but keeps awards and all-time stares. Each coin = +10% forever. The farther you get, the more coins.</div>';

  function rebirth() {

  // test hook: simulate a steady player (5 clicks a second, buys sensibly, fights bosses when ready)
  function sim(maxT, targets, startCoins, won) {
    simming = true; const keepS = S; S = fresh(); S.coins = startCoins || 0; S.won = won || 0; const log = [], hp = [];
