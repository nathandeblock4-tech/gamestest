<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Invaders · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1020; color: #f2f3ff; font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 16px 12px 32px; }
  .wrap { max-width: 640px; margin: 0 auto; text-align: center; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  a.back { color: #f2f3ff; background: #24274a; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; }
  h1 { font-family: 'Press Start 2P', monospace; font-size: 14px; color: #ffcc33; }
  canvas { width: 100%; max-width: 600px; aspect-ratio: 5 / 6; border-radius: 14px; border: 3px solid #24274a; background: #05060e; display: block; margin: 0 auto; touch-action: none; }
  .help { color: #9aa0c7; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>BANANA INVADERS</h1><span></span></div>
  <canvas id="c" width="500" height="600"></canvas>
  <p class="help">← → or A / D to move, Space to fire bananas. On a phone: drag to move, it fires automatically. Defend the zoo from the Demetrius invasion!</p>
</div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  let best = parseInt(load('invBest') || '0', 10);
  const img = new Image(); let photoOK = false; img.onload = () => { photoOK = true; }; img.src = 'demetrius.jpg';
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 2 + 0.5 }));
  let ship, shots, bombs, aliens, parts, score, lives, wave, dir, state = 'ready', keys = {}, cool = 0, touchX = null, inv = 0;
  let ac = null;
  function snd(f0, f1, d, type, vol) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
  function makeWave() {
    aliens = []; const rows = Math.min(5, 3 + Math.floor(wave / 2)), cols = 7;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) aliens.push({ x: 60 + c * 58, y: 70 + r * 50, hp: r === 0 && wave > 2 ? 2 : 1 });
    dir = 1;
  }
  function reset() { ship = { x: W / 2 }; shots = []; bombs = []; parts = []; score = 0; lives = 3; wave = 1; inv = 0; makeWave(); }
  function burst(x, y, color, n) { for (let i = 0; i < (n || 14); i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, life: 1, color }); }
  function fire() { if (cool > 0 || state !== 'run') return; shots.push({ x: ship.x, y: H - 70 }); cool = 16; snd(900, 400, 0.12, 'square', 0.05); }
  function update(k) {
    stars.forEach(s => { s.y += s.s * k; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } });
    parts.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.life -= 0.03 * k; }); parts = parts.filter(p => p.life > 0);
    if (state !== 'run') return;
    cool -= k; inv = Math.max(0, inv - k);
    if (keys.arrowleft || keys.a) ship.x -= 6 * k;
    if (keys.arrowright || keys.d) ship.x += 6 * k;
    if (touchX !== null) { ship.x += Math.max(-7 * k, Math.min(7 * k, touchX - ship.x)); fire(); }
    if (keys[' ']) fire();
    ship.x = Math.max(24, Math.min(W - 24, ship.x));
    shots.forEach(s => s.y -= 9 * k); shots = shots.filter(s => s.y > -20);
    const speed = (0.6 + wave * 0.25) * (1 + (1 - aliens.length / 35) * 1.5);
    let edge = false; aliens.forEach(a => { a.x += dir * speed * k; if (a.x < 24 || a.x > W - 24) edge = true; });
    if (edge) { dir *= -1; aliens.forEach(a => a.y += 18); }
    if (Math.random() < (0.012 + wave * 0.004) * k && aliens.length) { const a = aliens[Math.floor(Math.random() * aliens.length)]; bombs.push({ x: a.x, y: a.y + 16 }); }
    bombs.forEach(b => b.y += (3 + wave * 0.3) * k); bombs = bombs.filter(b => b.y < H);
    for (const s of shots) for (const a of aliens) {
      if (!s.dead && !a.dead && Math.abs(s.x - a.x) < 22 && Math.abs(s.y - a.y) < 20) {
        s.dead = true; a.hp--; if (a.hp <= 0) { a.dead = true; score += 10 * wave; burst(a.x, a.y, '#ffcc33'); snd(300, 80, 0.2, 'sawtooth', 0.06); } else snd(500, 300, 0.05, 'square', 0.04);
      }
    }
    shots = shots.filter(s => !s.dead); aliens = aliens.filter(a => !a.dead);
    for (const b of bombs) if (!b.dead && inv <= 0 && Math.abs(b.x - ship.x) < 22 && b.y > H - 70 && b.y < H - 30) { b.dead = true; hit(); }
    bombs = bombs.filter(b => !b.dead);
    if (aliens.some(a => a.y > H - 90)) { lives = 0; hit(); }
    if (!aliens.length) { wave++; makeWave(); shots = []; bombs = []; snd(523, 1046, 0.4, 'triangle', 0.08); }
  }
  function hit() {
    lives--; inv = 90; burst(ship.x, H - 50, '#60a5fa', 30); snd(200, 40, 0.5, 'sawtooth', 0.12);
    if (lives <= 0) { state = 'over'; if (score > best) { best = score; save('invBest', best); } }
  }
  function drawAlien(a) {
    const r = 20, wob = Math.sin(performance.now() / 200 + a.x) * 2;
    ctx.save(); ctx.translate(a.x, a.y + wob);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = '#7a3a14'; ctx.fill();
    if (photoOK) { ctx.save(); ctx.clip(); const ar = img.width / img.height; const h = r * 2.4, w = h * ar; ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore(); }
    else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-7, -3, 5, 0, 7); ctx.arc(7, -3, 5, 0, 7); ctx.fill(); ctx.fillStyle = '#300'; ctx.beginPath(); ctx.ellipse(0, 9, 6, 5, 0, 0, 7); ctx.fill(); }
    ctx.lineWidth = 3; ctx.strokeStyle = a.hp > 1 ? '#ff4fa3' : '#2b1306'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  function draw() {
    ctx.fillStyle = '#05060e'; ctx.fillRect(0, 0, W, H);
    stars.forEach(s => { ctx.fillStyle = 'rgba(255,255,255,' + (0.3 + s.s / 4) + ')'; ctx.fillRect(s.x, s.y, s.s, s.s); });
    aliens.forEach(drawAlien);
    ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    shots.forEach(s => ctx.fillText('🍌', s.x, s.y));
    bombs.forEach(b => { ctx.fillStyle = '#ff5a5a'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, 7); ctx.fill(); });
    if (state !== 'over' && (inv <= 0 || Math.floor(inv / 6) % 2)) {
      ctx.save(); ctx.translate(ship.x, H - 50);
      ctx.fillStyle = '#60a5fa'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(22, 16); ctx.lineTo(-22, 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c9e4ff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff9a3c'; ctx.fillRect(-10, 16, 6, 6 + Math.random() * 6); ctx.fillRect(4, 16, 6, 6 + Math.random() * 6);
      ctx.restore();
    }
    parts.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }); ctx.globalAlpha = 1;
    ctx.fillStyle = '#9aa0c7'; ctx.font = '700 16px Rubik'; ctx.textAlign = 'left'; ctx.fillText('Score ' + score + '   Wave ' + wave, 14, 24);
    ctx.textAlign = 'right'; ctx.fillText('❤️'.repeat(Math.max(0, lives)) + '   Best ' + best, W - 14, 24);
    if (state !== 'run') {
      ctx.fillStyle = 'rgba(5,6,14,.7)'; ctx.fillRect(0, 0, W, H); ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc33'; ctx.font = '20px "Press Start 2P", monospace'; ctx.fillText(state === 'over' ? 'GAME OVER' : 'BANANA INVADERS', W / 2, H / 2 - 20);
      ctx.fillStyle = '#f2f3ff'; ctx.font = '700 17px Rubik'; ctx.fillText(state === 'over' ? 'Score ' + score + ' · tap or Space to retry' : 'Tap or press Space to start', W / 2, H / 2 + 20);
    }
  }
  function startIfNeeded() { if (state !== 'run') { reset(); state = 'run'; cool = 10; } }
  let last = 0;
  function loop(t) { const k = last ? Math.min(3, (t - last) / 16.67) : 1; last = t; update(k); draw(); requestAnimationFrame(loop); }
  document.addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === ' ') { e.preventDefault(); if (state !== 'run') { startIfNeeded(); return; } } keys[k] = true; if (k.startsWith('arrow')) e.preventDefault(); });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  const tx = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; };
  cv.addEventListener('pointerdown', e => { startIfNeeded(); if (e.pointerType !== 'mouse') touchX = tx(e); else fire(); });
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') ship.x = tx(e); else if (touchX !== null) touchX = tx(e); });
  cv.addEventListener('pointerup', () => { touchX = null; });
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
