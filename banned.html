<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banned</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: radial-gradient(ellipse at 50% 30%, #3a0d12, #0b0607 70%); color: #f4e9ea; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .box { max-width: 520px; width: 100%; text-align: center; }
  .icon { width: 96px; height: 96px; margin: 0 auto 18px; border-radius: 50%; border: 8px solid #ff3b4a; position: relative; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  .icon::after { content: ''; position: absolute; left: 50%; top: 50%; width: 92px; height: 8px; background: #ff3b4a; transform: translate(-50%, -50%) rotate(-45deg); border-radius: 4px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  h1 { font-size: clamp(30px, 7vw, 46px); margin: 0 0 8px; letter-spacing: -.01em; }
  p { margin: 0 0 6px; color: #d7c4c6; }
  .reason { margin: 22px 0 0; padding: 14px 16px; border-radius: 12px; background: rgba(255,59,74,.1); border: 1px solid rgba(255,59,74,.35); text-align: left; }
  .reason b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #ff8a93; margin-bottom: 4px; }
  .meta { margin-top: 18px; font-size: 12px; color: #8f7d80; }
  .box.wide { max-width: 760px; }
  .appeal { margin-top: 26px; text-align: left; }
  .btn { display: inline-block; border: 0; border-radius: 12px; padding: 13px 20px; font: 700 16px system-ui, sans-serif; cursor: pointer; background: #f4e9ea; color: #2a0b0e; transition: transform .1s, filter .1s; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); } .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  .btn.ghost { background: transparent; color: #d7c4c6; border: 1px solid rgba(255,255,255,.2); }
  .start { text-align: center; } .start p { font-size: 14px; }
  .paper { background: #fbf8f1; color: #24201c; border-radius: 6px; padding: 26px 30px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .paper h2 { margin: 0 0 12px; font: 600 15px Georgia, serif; color: #6b5f55; }
  textarea { width: 100%; min-height: 420px; max-height: 62vh; border: 0; outline: 0; resize: vertical; background: transparent repeating-linear-gradient(transparent 0 31px, #d9e3f0 31px 32px) local; color: inherit; font: 17px/32px Georgia, 'Times New Roman', serif; padding: 0; }
  .pages { display: flex; gap: 6px; margin: 16px 0 8px; } .pages i { flex: 1; height: 34px; border-radius: 4px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); position: relative; overflow: hidden; }
  .pages i b { position: absolute; left: 0; bottom: 0; right: 0; background: linear-gradient(#ffd0d4, #ff8a93); transition: height .3s; } .pages i.full { border-color: #ff8a93; }
  .count { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: #d7c4c6; } .count b { color: #fff; }
  .warn { min-height: 20px; margin-top: 6px; font-size: 13px; color: #ffb36b; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .note { margin-top: 22px; padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); font-size: 15px; text-align: left; }
  .note.bad { background: rgba(255,59,74,.1); border-color: rgba(255,59,74,.35); }
</style>
</head>
<body>
<div class="box">
  <div class="icon" aria-hidden="true"></div>
  <h1>You've been banned</h1>
  <p>You can't use Arcade anymore.</p>
  <div class="reason" id="reasonBox" hidden><b>Reason</b><span id="reason"></span></div>
  <div class="meta" id="meta"></div>
  <div class="appeal" id="appeal"></div>
</div>
<script>
(function () {
  var FB = 'https://game-site-2a81e-default-rtdb.firebaseio.com', K = 'gr_cfg';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ck(k) { try { var m = document.cookie.match(new RegExp('(?:^|; )' + k + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; } catch (e) { return null; } }
  function idb(cb) { try { var r = indexedDB.open('arcade', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { cb(r.result); }; r.onerror = function () { cb(null); }; } catch (e) { cb(null); } }
  function idbGet(k, cb) { idb(function (db) { if (!db) return cb(null); try { var q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { cb(q.result || null); }; q.onerror = function () { cb(null); }; } catch (e) { cb(null); } }); }
  function j(p) { return fetch(FB + '/' + p + '.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function clearAll(done) { // only runs after the admin unbans you
    try { localStorage.removeItem(K); } catch (e) {}
    try { document.cookie = K + '=;max-age=0;path=/;SameSite=Lax'; } catch (e) {}
    idb(function (db) { if (!db) return done(); try { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete('cfg'); t.oncomplete = done; t.onerror = done; } catch (e) { done(); } });
  }
  var TEST = /[?&]test\b/.test(location.search); // admin preview: nothing here bans or unbans anyone
  function start(key) {
    if (TEST) {
      document.title = 'Banned (test)'; document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;top:0;left:0;right:0;z-index:9;background:#ffd23a;color:#2a1a00;text-align:center;font:700 14px system-ui;padding:8px 12px">🧪 TEST MODE: this is only a preview. You are not banned. <a href="admin.html" style="color:inherit;margin-left:8px">Back to admin</a></div>');
      document.getElementById('reason').textContent = 'This is a test ban to try out the ban screen'; document.getElementById('reasonBox').hidden = false;
      document.getElementById('meta').textContent = 'Banned ' + new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + ' · ID ' + key;
      appeal(key); return;
    }
    if (!/^[uf]_[A-Za-z0-9]{4,24}$/.test(key || '')) { location.replace('index.html'); return; }
    var path = (key.charAt(0) === 'u' ? 'bans/' : 'fpbans/') + key.slice(2);
    j(path).then(function (b) {
      if (b && b.reason) { document.getElementById('reason').textContent = String(b.reason).slice(0, 300); document.getElementById('reasonBox').hidden = false; }
      if (b && typeof b.t === 'number') document.getElementById('meta').textContent = 'Banned ' + new Date(b.t).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) + ' · ID ' + key;
      else document.getElementById('meta').textContent = 'ID ' + key;
    });
    appeal(key);
    function check() { j('unban/' + key).then(function (u) { if (u) clearAll(function () { location.replace('index.html'); }); }); }
    check(); setInterval(check, 20000);
  }
  // ---------- the 10-page apology letter ----------
  var WORDS_PER_PAGE = 250, PAGES = 10, NEED = WORDS_PER_PAGE * PAGES, box = document.getElementById('appeal'), timer = null;
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function score(text) { // only real, non-repeated writing counts toward the 10 pages
    var sentences = text.split(/[.!?\n]+/), seen = {}, counted = 0, junk = 0, freq = {}, total = 0;
    sentences.forEach(function (s) {
      var words = s.toLowerCase().match(/[a-z']+/g) || []; if (!words.length) return;
      var norm = words.join(' '); total += words.length;
      if (words.length >= 3 && seen[norm]) { junk += words.length; return; } seen[norm] = 1;
      words.forEach(function (w) {
        var gib = w.length > 18 || (w.length > 3 && !/[aeiouy]/.test(w)) || /(.)\1\1/.test(w);
        if (gib) { junk++; return; }
        freq[w] = (freq[w] || 0) + 1;
        if (w.length > 3 && freq[w] > 40 && freq[w] > counted * 0.05) { junk++; return; } // spamming one word
        counted++;
      });
    });
    return { counted: counted, junk: junk, total: total };
  }
  function appeal(key) {
    var AK = 'gr_apology_' + key;
    function intro(msg, bad) {
      box.innerHTML = (msg ? '<div class="note' + (bad ? ' bad' : '') + '">' + msg + '</div>' : '') +
        '<div class="start" style="margin-top:22px"><p>Want back in? Write a <b>10-page apology letter</b> (' + NEED.toLocaleString() + ' words). The admin will read it and decide.</p><button class="btn" id="startBtn">✍️ Write an apology letter</button></div>';
      document.getElementById('startBtn').onclick = editor;
    }
    function editor() {
      document.querySelector('.box').classList.add('wide');
      var pages = ''; for (var i = 0; i < PAGES; i++) pages += '<i title="Page ' + (i + 1) + '"><b style="height:0"></b></i>';
      box.innerHTML = '<div class="paper"><h2>Dear Admin,</h2><textarea id="txt" spellcheck="true" placeholder="Start writing your apology here. Explain what you did, why it was wrong, and why you should be let back in…"></textarea></div>' +
        '<div class="pages" id="pages">' + pages + '</div><div class="count"><span id="pg"></span><span id="wc"></span></div><div class="warn" id="warn"></div>' +
        '<div class="row"><span style="font-size:13px;color:#8f7d80;margin-right:auto">Saved on this computer as you type · copy-paste is turned off</span>' + (TEST ? '<button class="btn ghost" id="fillBtn">⚡ Fill 10 pages (test only)</button>' : '') + '<button class="btn ghost" id="backBtn">Back</button><button class="btn" id="sendBtn" disabled>Send letter</button></div>';
      var ta = document.getElementById('txt'), send = document.getElementById('sendBtn');
      ta.value = (function () { try { return localStorage.getItem(AK) || ''; } catch (e) { return ''; } })();
      ['paste', 'drop'].forEach(function (ev) { ta.addEventListener(ev, function (e) { e.preventDefault(); warn('No copy-paste. You have to actually write it. ✍️'); }); });
      var warnT = null; function warn(t) { var w = document.getElementById('warn'); w.textContent = t; clearTimeout(warnT); warnT = setTimeout(function () { update(); }, 2600); }
      function update() {
        var r = score(ta.value), n = Math.min(r.counted, NEED), cells = document.getElementById('pages').children;
        for (var i = 0; i < PAGES; i++) { var f = Math.max(0, Math.min(1, (n - i * WORDS_PER_PAGE) / WORDS_PER_PAGE)); cells[i].firstChild.style.height = (f * 100) + '%'; cells[i].classList.toggle('full', f >= 1); }
        var page = Math.min(PAGES, Math.floor(n / WORDS_PER_PAGE) + 1);
        document.getElementById('pg').innerHTML = n >= NEED ? '<b>All 10 pages done!</b> 🎉' : 'Page <b>' + page + '</b> of ' + PAGES;
        document.getElementById('wc').innerHTML = '<b>' + n.toLocaleString() + '</b> / ' + NEED.toLocaleString() + ' words';
        document.getElementById('warn').textContent = r.junk > 25 ? r.junk.toLocaleString() + ' words don’t count (copied sentences, the same word over and over, or keyboard mashing).' : '';
        send.disabled = n < NEED;
        store(AK, ta.value);
      }
      ta.addEventListener('input', update); update(); ta.focus();
      if (TEST) document.getElementById('fillBtn').onclick = function () { var W = 'i am really sorry for what i did on the arcade and i promise to follow the rules from now on because everyone deserves to have fun and feel safe while playing games with their friends at school every single day of the week'.split(' '), out = [], n = 0; while (n < NEED + 60) { var len = 7 + Math.floor(Math.random() * 9), s = []; for (var i = 0; i < len; i++) s.push(W[Math.floor(Math.random() * W.length)]); s[0] = s[0].charAt(0).toUpperCase() + s[0].slice(1); out.push(s.join(' ') + '.'); n += len; } ta.value = out.join(' '); update(); };
      document.getElementById('backBtn').onclick = function () { document.querySelector('.box').classList.remove('wide'); intro(); };
      send.onclick = function () {
        if (!confirm('Send your letter to the admin? You can’t change it after sending.')) return;
        send.disabled = true; send.textContent = 'Sending…';
        var name = (function () { try { return localStorage.getItem('gr_name') || ''; } catch (e) { return ''; } })();
        fetch(FB + '/appeals/' + key + '.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: ta.value.slice(0, 60000), words: score(ta.value).counted, name: name.slice(0, 20), status: 'pending', t: { '.sv': 'timestamp' } }) })
          .then(function (r) { if (!r.ok) throw 0; store(AK, null); document.querySelector('.box').classList.remove('wide'); show({ status: 'pending' }); })
          .catch(function () { send.disabled = false; send.textContent = 'Send letter'; warn('Couldn’t send. Check your internet and try again.'); });
      };
    }
    function show(a) {
      if (!a) return intro();
      if (a.status === 'pending') { box.innerHTML = '<div class="note">📨 <b>Your apology letter was sent.</b><br>The admin will read it. If they accept it, this page will let you back in on its own.</div>'; return; }
      if (a.status === 'accepted') { box.innerHTML = '<div class="note" style="border-color:rgba(47,191,113,.5);background:rgba(47,191,113,.12)">✅ <b>Your letter was accepted!</b><br>' + (TEST ? 'In a real ban, this page would now send them back to the Arcade. <button class="btn ghost" id="again" style="margin-top:10px;padding:8px 14px;font-size:14px">Test again</button>' : 'Taking you back to the Arcade…') + '</div>'; var ag = document.getElementById('again'); if (ag) ag.onclick = function () { fetch(FB + '/appeals/' + key + '.json', { method: 'DELETE' }).then(function () { intro(); }); }; return; }
      if (a.status === 'rejected') intro('❌ <b>Your letter was rejected.</b>' + (a.note ? '<br>Admin says: “' + esc(String(a.note).slice(0, 300)) + '”' : '') + '<br>You can write a new one.', true);
    }
    j('appeals/' + key).then(show);
    var lastS = null; setInterval(function () { j('appeals/' + key).then(function (a) { var st = a ? a.status : null; if (st === lastS || document.getElementById('txt')) return; lastS = st; if (st === 'rejected' && document.querySelector('.note.bad')) return; show(a); }); }, TEST ? 3000 : 20000);
  }
  if (TEST) start('t_preview'); else { var key = get(K) || ck(K); if (key) start(key); else idbGet('cfg', start); }
})();
</script>
</body>
</html>
