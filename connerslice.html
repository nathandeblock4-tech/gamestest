<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex">
<title>Conner Slice · Game Room</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #10111f; color: #fff; font-family: 'Rubik', system-ui, sans-serif; min-height: 100vh; padding: 12px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  a.back { color: #fff; background: #24274a; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-weight: 700; }
  h1 { font-weight: 900; font-size: 18px; letter-spacing: 2px; color: #ff5470; }
  canvas { width: 100%; aspect-ratio: 560 / 700; display: block; border-radius: 16px; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  p { color: #9aa0c7; font-size: 14px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="index.html">← Back</a><h1>CONNER SLICE</h1><span style="width:60px"></span></div>
  <canvas id="c" width="560" height="700"></canvas>
  <p>Swipe (or drag the mouse) through the Conner heads. Don't miss 3, and never slice a bomb!</p>
</div>
<script src="conner-lock.js"></script>
<script>
connerLock('CONNER SLICE', '#ff5470', face => {
  const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 560, H = 700, R = 42;
  function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  let best = +(function () { try { return localStorage.getItem('connerSliceBest') || 0; } catch (e) { return 0; } })();
  let things, halves, parts, trail, pops, score, lives, state, spawnT, wave, time, combo, comboT, flash, down = false;
  let ac = null;
  function tone(f, d, vol, type, f2) { try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); const t = ac.currentTime, o = ac.createOscillator(), gn = ac.createGain(); o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {} }
  function reset() { things = []; halves = []; parts = []; trail = []; pops = []; score = 0; lives = 3; spawnT = 1; wave = 0; time = 0; combo = 0; comboT = 0; flash = 0; }
  reset(); state = 'menu';
  function launch() {
    wave++;
    const n = 1 + Math.min(4, Math.floor(Math.random() * (1 + wave / 6)));
    for (let i = 0; i < n; i++) {
      const bomb = wave > 3 && Math.random() < Math.min(0.28, 0.08 + wave * 0.008);
      const gold = !bomb && Math.random() < 0.06;
      const x = 80 + Math.random() * (W - 160);
      things.push({ x, y: H + R + i * 30, vx: (W / 2 - x) * (0.004 + Math.random() * 0.006) * 60 / 60, vy: -(15 + Math.random() * 4), rot: 0, vr: (Math.random() - 0.5) * 0.12, bomb, gold, dead: false });
    }
    spawnT = Math.max(0.7, 1.9 - wave * 0.03);
  }
  function slice(o, ax, ay) {
    o.dead = true;
    if (o.bomb) { state = 'boom'; flash = 1; tone(80, 0.8, 0.3, 'sawtooth', 30); if (score > best) { best = score; save('connerSliceBest', best); } return; }
    const ang = Math.atan2(ay, ax) || 0;
    for (const s of [-1, 1]) halves.push({ x: o.x, y: o.y, vx: o.vx * 0.5 + Math.cos(ang + Math.PI / 2) * 3 * s, vy: o.vy * 0.4 - 2, rot: o.rot, vr: 0.08 * s, side: s, cut: ang, gold: o.gold, life: 1.6 });
    for (let k = 0; k < 18; k++) parts.push({ x: o.x, y: o.y, vx: (Math.random() - 0.5) * 9, vy: (Math.random() - 0.7) * 9, life: 1, c: o.gold ? '#ffd447' : (Math.random() < 0.5 ? '#ff5470' : '#ffb3c0') });
    combo++; comboT = 0.25; const pts = o.gold ? 10 : 1; score += pts;
    pops.push({ x: o.x, y: o.y - 30, t: 0, s: '+' + pts, c: o.gold ? '#ffd447' : '#fff' });
    tone(700 + combo * 90 + Math.random() * 80, 0.12, 0.12, 'square', 300);
  }
  function segHit(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1, dy = y2 - y1, l = dx * dx + dy * dy; let t = l ? ((cx - x1) * dx + (cy - y1) * dy) / l : 0; t = Math.max(0, Math.min(1, t));
    const px = x1 + t * dx - cx, py = y1 + t * dy - cy; return px * px + py * py < r * r;
  }
  function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    if (state !== 'play') { reset(); state = 'play'; tone(520, 0.15, 0.1); return; }
    down = true; const [x, y] = pos(e); trail = [{ x, y, t: 0 }];
  });
  cv.addEventListener('pointermove', e => {
    if (!down || state !== 'play') return; const [x, y] = pos(e), p = trail[trail.length - 1]; trail.push({ x, y, t: 0 });
    if (p && Math.hypot(x - p.x, y - p.y) > 2) for (const o of things) if (!o.dead && segHit(p.x, p.y, x, y, o.x, o.y, R)) slice(o, x - p.x, y - p.y);
  });
  const up = () => { down = false; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  function update(dt) {
    const k = dt * 60; time += dt;
    if (state === 'play') {
      spawnT -= dt; if (spawnT <= 0) launch();
      for (const o of things) { o.x += o.vx * k; o.y += o.vy * k; o.vy += 0.3 * k; o.rot += o.vr * k;
        if (!o.dead && o.vy > 0 && o.y > H + R + 10) { o.dead = true; if (!o.bomb) { lives--; tone(200, 0.3, 0.12, 'sawtooth', 120); flash = 0.4; if (lives <= 0) { state = 'over'; if (score > best) { best = score; save('connerSliceBest', best); } } } } }
      things = things.filter(o => !o.dead);
      if (comboT > 0) { comboT -= dt; if (comboT <= 0) { if (combo >= 3) { score += combo; pops.push({ x: W / 2, y: 200, t: 0, s: combo + ' HEAD COMBO! +' + combo, c: '#ff5470', big: 1 }); tone(990, 0.3, 0.1); } combo = 0; } }
    }
    for (const h of halves) { h.x += h.vx * k; h.y += h.vy * k; h.vy += 0.35 * k; h.rot += h.vr * k; h.life -= dt; }
    halves = halves.filter(h => h.life > 0 && h.y < H + 100);
    for (const p of parts) { p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.3 * k; p.life -= dt * 1.4; }
    parts = parts.filter(p => p.life > 0);
    trail.forEach(t => t.t += dt); trail = trail.filter(t => t.t < 0.15);
    pops.forEach(p => p.t += dt * (p.big ? 0.7 : 1.5)); pops = pops.filter(p => p.t < 1);
    flash = Math.max(0, flash - dt * 1.5);
  }
  function drawBomb(o) {
    g.save(); g.translate(o.x, o.y); g.rotate(o.rot);
    g.fillStyle = '#16161c'; g.beginPath(); g.arc(0, 0, R * 0.85, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#ff2a2a'; g.lineWidth = 4; g.stroke();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.arc(-12, -12, 9, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#555'; g.fillRect(-7, -R * 0.85 - 10, 14, 12);
    g.strokeStyle = '#c9a36b'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -R * 0.85 - 10); g.quadraticCurveTo(10, -R - 20, 18, -R - 14); g.stroke();
    g.fillStyle = Math.sin(time * 40) > 0 ? '#ffd447' : '#ff6a00'; g.beginPath(); g.arc(18, -R - 14, 5 + Math.random() * 3, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ff2a2a'; g.font = '900 20px Rubik, sans-serif'; g.textAlign = 'center'; g.fillText('✕', 0, 7);
    g.restore();
  }
  function headGlow(o) { if (o.gold) { g.save(); g.shadowColor = '#ffd447'; g.shadowBlur = 30; g.fillStyle = '#ffd447'; g.beginPath(); g.ellipse(o.x, o.y, R + 6, R * 1.2 + 6, o.rot, 0, Math.PI * 2); g.fill(); g.restore(); } }
  function draw() {
    const bg = g.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 520); bg.addColorStop(0, '#3a2318'); bg.addColorStop(1, '#170d08');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 3; for (let y = 60; y < H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + 10); g.stroke(); }
    for (const h of halves) {
      g.save(); g.translate(h.x, h.y); g.rotate(h.cut); g.beginPath(); g.rect(-100, h.side < 0 ? -100 : 0, 200, 100); g.clip(); g.rotate(-h.cut);
      g.globalAlpha = Math.min(1, h.life); drawConnerHead(g, face, 0, 0, R * 2, h.rot, 3);
      g.restore();
    }
    for (const o of things) { if (o.bomb) drawBomb(o); else { headGlow(o); drawConnerHead(g, face, o.x, o.y, R * 2, o.rot, 4); } }
    parts.forEach(p => { g.globalAlpha = p.life; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, 4, 0, Math.PI * 2); g.fill(); }); g.globalAlpha = 1;
    if (trail.length > 1) { g.lineCap = 'round'; for (let i = 1; i < trail.length; i++) { const a = trail[i - 1], b = trail[i]; g.strokeStyle = 'rgba(255,255,255,' + (1 - b.t / 0.15) + ')'; g.lineWidth = 3 + 8 * (i / trail.length); g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke(); } }
    g.textAlign = 'center';
    pops.forEach(p => { g.globalAlpha = 1 - p.t; g.font = (p.big ? '900 30px' : '900 24px') + ' Rubik, sans-serif'; g.lineWidth = 5; g.strokeStyle = '#000'; g.strokeText(p.s, p.x, p.y - p.t * 40); g.fillStyle = p.c; g.fillText(p.s, p.x, p.y - p.t * 40); }); g.globalAlpha = 1;
    g.textAlign = 'left'; g.font = '900 40px Rubik, sans-serif'; g.fillStyle = '#fff'; g.fillText(score, 20, 52);
    g.font = '700 16px Rubik, sans-serif'; g.fillStyle = '#ffb3c0'; g.fillText('Best ' + best, 22, 76);
    g.textAlign = 'right'; g.font = '900 32px Rubik, sans-serif';
    for (let i = 0; i < 3; i++) { g.fillStyle = i < 3 - lives ? '#ff2a2a' : 'rgba(255,255,255,.2)'; g.fillText('✕', W - 20 - i * 34, 50); }
    if (flash > 0) { g.fillStyle = state === 'boom' ? 'rgba(255,255,255,' + flash + ')' : 'rgba(255,0,0,' + flash * 0.3 + ')'; g.fillRect(0, 0, W, H); }
    if (state !== 'play') {
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H / 2 - 130, W, 260); g.textAlign = 'center';
      if (state === 'menu') drawConnerHead(g, face, W / 2, H / 2 - 230, 120, Math.sin(time * 2) * 0.15, 5);
      g.fillStyle = '#ff5470'; g.font = '900 44px Rubik, sans-serif';
      g.fillText(state === 'menu' ? 'CONNER SLICE' : state === 'boom' ? 'BOOM!' : 'GAME OVER', W / 2, H / 2 - 40);
      g.fillStyle = '#fff'; g.font = '700 22px Rubik, sans-serif';
      g.fillText(state === 'menu' ? 'Best ' + best : 'Score ' + score + '  ·  Best ' + best, W / 2, H / 2 + 5);
      g.fillStyle = '#ddd'; g.fillText('Tap to ' + (state === 'menu' ? 'start' : 'play again'), W / 2, H / 2 + 60);
    }
  }
  let last = 0;
  function frame(t) { const dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016; last = t; update(dt); draw(); requestAnimationFrame(frame); }
  window.__t = { st: () => ({ state, score, lives, n: things.length }), force: () => { state = 'play'; launch(); } };
  requestAnimationFrame(frame);
});
</script>
<script src="presence.js" defer></script>
</body>
</html>
