<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-Ball Pool · Arcade</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #0f1113; color: #eef0f3; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; }
  .bar { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #1f2328; }
  .bar a, .bar button, .bar select { background: #1d2126; color: #eef0f3; border: none; border-radius: 7px; padding: 7px 12px; font: 600 14px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  .bar a:hover, .bar button:hover { background: #2a2f36; }
  .bar h1 { font-size: 17px; font-weight: 750; }
  .sp { flex: 1; }
  .players { display: flex; gap: 14px; align-items: stretch; justify-content: center; padding: 10px 16px 0; }
  .pl { background: #171a1e; border: 2px solid transparent; border-radius: 12px; padding: 8px 14px; min-width: 300px; display: flex; flex-direction: column; gap: 6px; transition: border-color .2s; }
  .pl.on { border-color: #f5c84b; }
  .pl .nm { font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; gap: 10px; }
  .pl .nm small { color: #9aa1ab; font-weight: 600; }
  .tray { display: flex; gap: 4px; height: 22px; }
  .tray i { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font: 700 10px system-ui; font-style: normal; color: #111; box-shadow: inset -3px -3px 5px rgba(0,0,0,.35); }
  .tray i.gone { opacity: .18; }
  .msg { text-align: center; height: 26px; line-height: 26px; font-weight: 650; font-size: 15px; color: #f5c84b; margin-top: 6px; }
  canvas#c { display: block; margin: 0 auto; cursor: crosshair; }
  .bottom { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 8px auto 0; padding: 0 20px; }
  .spin { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #c4cad2; font-weight: 600; }
  .spin small { color: #7d848e; font-weight: 500; font-size: 11px; }
  .spin canvas { cursor: pointer; }
  .help { font-size: 12px; color: #7d848e; line-height: 1.6; }
  .over { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  .over.on { display: flex; }
  .panel { background: #171a1e; border: 1px solid #2a2f36; border-radius: 14px; padding: 28px 36px; text-align: center; min-width: 320px; }
  .panel h2 { font-size: 28px; margin-bottom: 8px; }
  .panel p { color: #b8bec7; margin-bottom: 4px; }
  .panel button { margin-top: 16px; background: #f5c84b; color: #1a1400; border: none; border-radius: 8px; padding: 10px 22px; font: 700 15px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<div class="bar">
  <a href="index.html">← Back</a>
  <h1>8-Ball Pool</h1>
  <select id="mode">
    <option value="1">vs Computer · Easy</option>
    <option value="2" selected>vs Computer · Medium</option>
    <option value="3">vs Computer · Hard</option>
    <option value="4">vs Computer · Pro</option>
    <option value="0">2 Players</option>
  </select>
  <button id="newBtn">New game</button>
  <div class="sp"></div>
  <span id="rec" style="font-size:13px;color:#9aa1ab"></span>
</div>
<div class="players">
  <div class="pl" id="p0"><div class="nm"><span id="n0">You</span><small id="g0">Open table</small></div><div class="tray" id="t0"></div></div>
  <div class="pl" id="p1"><div class="nm"><span id="n1">Computer</span><small id="g1">Open table</small></div><div class="tray" id="t1"></div></div>
</div>
<div class="msg" id="msg"></div>
<canvas id="c"></canvas>
<div class="bottom"><div class="help">Move the mouse to aim · press and pull back to set power, release to shoot<br>← → fine aim (Shift = finer) · ball in hand: move the cue ball and click to place</div>
<div class="spin"><canvas id="spin" width="84" height="84" style="width:56px;height:56px"></canvas><span>Spin<br><small>top = follow · bottom = draw<br>sides = english</small></span></div></div>
<div class="over" id="over"><div class="panel"><h2 id="oh"></h2><p id="op"></p><button id="againBtn">Play again</button></div></div>
<script src="presence.js"></script>
<script>
// ================= constants =================
const W = 1000, H = 500, R = 11.4, CW = 18, RAIL = 54;
const DEC = 155, E_BALL = 0.95, E_RAIL = 0.76, MAXV = 3100;
const COL = { 1: [244, 194, 13], 2: [31, 79, 209], 3: [211, 32, 32], 4: [96, 44, 140], 5: [242, 106, 27], 6: [19, 138, 60], 7: [122, 26, 26], 8: [18, 18, 20] };
for (let n = 9; n <= 15; n++) COL[n] = COL[n - 8];
const POCKETS = [[-11, -11, 23], [W / 2, -21, 19], [W + 11, -11, 23], [-11, H + 11, 23], [W / 2, H + 21, 19], [W + 11, H + 11, 23]];
// cushion segments (nose + jaws)
const SEG = [];
function rail(pts) { for (let i = 0; i < pts.length - 1; i++) SEG.push([pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]]); }
const CG = 31, SG = 23;
rail([[15, -CW], [CG, 0], [W / 2 - SG, 0], [W / 2 - SG + 3, -CW]]);
rail([[W / 2 + SG - 3, -CW], [W / 2 + SG, 0], [W - CG, 0], [W - 15, -CW]]);
rail([[15, H + CW], [CG, H], [W / 2 - SG, H], [W / 2 - SG + 3, H + CW]]);
rail([[W / 2 + SG - 3, H + CW], [W / 2 + SG, H], [W - CG, H], [W - 15, H + CW]]);

rail([[W + CW, 15], [W, CG], [W, H - CG], [W + CW, H - 15]]);
const RAILPOLY = [
  [[15, -CW], [CG, 0], [W / 2 - SG, 0], [W / 2 - SG + 3, -CW]], [[W / 2 + SG - 3, -CW], [W / 2 + SG, 0], [W - CG, 0], [W - 15, -CW]],
  [[15, H + CW], [CG, H], [W / 2 - SG, H], [W / 2 - SG + 3, H + CW]], [[W / 2 + SG - 3, H + CW], [W / 2 + SG, H], [W - CG, H], [W - 15, H + CW]],
  [[-CW, 15], [0, CG], [0, H - CG], [-CW, H - 15]], [[W + CW, 15], [W, CG], [W, H - CG], [W + CW, H - 15]]];

// ================= state =================
let balls, turn, groups, mode, breakShot, inHand, inHandBehind, moving, ev, over, aim = 0, power = 0, spin = 0, spinX = 0, msgT = '';
let cpuPlan = null, cpuT = 0, wins = ld('pool_rec', { w: 0, l: 0 });
function ld(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
function sv(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const ident = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
function randRot() { let M = ident(); for (let k = 0; k < 3; k++) M = rotM(M, [Math.random() - .5, Math.random() - .5, Math.random() - .5], Math.random() * 6); return M; }
function newBall(n, x, y) { return { n, x, y, vx: 0, vy: 0, on: true, M: randRot(), sp: 0, sx: 0 }; }
function newGame() {
  mode = +document.getElementById('mode').value;
  balls = [newBall(0, W * 0.25, H / 2)];
  const order = [1, 9, 2, 10, 3, 11, 4, 12, 5, 13, 6, 14, 7, 15].sort(() => Math.random() - .5);
  const slots = []; for (let k = 0; k < 5; k++) for (let j = 0; j <= k; j++) slots.push([W * 0.73 + k * R * 2 * 0.8661 * 1.003, H / 2 + (j - k / 2) * R * 2 * 1.003]);
  const rack = Array(15);
  rack[4] = 8; // center of row 3
  // back corners: one solid one stripe
  const s = order.findIndex(n => n < 8), st = order.findIndex(n => n > 8);
  rack[10] = order[s]; rack[14] = order[st]; const rest = order.filter((n, i) => i !== s && i !== st);
  for (let i = 0; i < 15; i++) if (rack[i] == null) rack[i] = rest.pop();
  slots.forEach((p, i) => balls.push(newBall(rack[i], p[0] + (Math.random() - .5) * 0.2, p[1] + (Math.random() - .5) * 0.2)));
  turn = 0; groups = [null, null]; breakShot = true; inHand = true; inHandBehind = true; moving = false; over = false; cpuPlan = null; spin = 0; spinX = 0;
  document.getElementById('over').classList.remove('on');
  setMsg(mode ? 'Your break. Place the cue ball behind the line, then shoot.' : 'Player 1 breaks. Place the cue ball behind the line.');
  ui(); drawSpin();
}
const cue = () => balls[0];
const human = () => mode === 0 || turn === 0;
function setMsg(t) { msgT = t; document.getElementById('msg').textContent = t; }

// ================= physics =================
function rotM(M, ax, ang) {
  const l = Math.hypot(ax[0], ax[1], ax[2]); if (l < 1e-9 || !ang) return M; const x = ax[0] / l, y = ax[1] / l, z = ax[2] / l, c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;

}
// one physics step; B = ball array; e = events {first, pots[], rails, clicks[]}; rot = update orientation
function step(B, dt, e, rot) {

      b.x += b.vx * dt; b.y += b.vy * dt;

      if (b.n === 0) { const nat = 0.28 * sp; b.sp += (nat - b.sp) * Math.min(1, 1.6 * dt); b.sx *= Math.exp(-0.7 * dt); }

    }
  }

    for (let j = i + 1; j < n; j++) { const b = B[j]; if (!b.on) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy; if (d2 >= 4 * R * R || d2 === 0) continue;

      const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny; if (rel <= 0) continue;
      const cueBall = a.n === 0 ? a : b.n === 0 ? b : null;
      let pre = null; if (cueBall && !e.hit) { const s = Math.hypot(cueBall.vx, cueBall.vy) || 1; pre = [cueBall.vx / s, cueBall.vy / s]; }

      }

    if (b.x > R + 1 && b.x < W - R - 1 && b.y > R + 1 && b.y < H - R - 1) continue;
    for (const s of SEG) {
      const ex = s[2] - s[0], ey = s[3] - s[1], L2 = ex * ex + ey * ey; let t = ((b.x - s[0]) * ex + (b.y - s[1]) * ey) / L2; t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = s[0] + ex * t, py = s[1] + ey * t, dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy; if (d2 >= R * R || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d; b.x = px + nx * R; b.y = py + ny * R;
      const vn = b.vx * nx + b.vy * ny; if (vn >= 0) continue;
      b.vx -= (1 + E_RAIL) * vn * nx; b.vy -= (1 + E_RAIL) * vn * ny;
      // side spin bites off the cushion
      if (b.n === 0 && b.sx) { b.vx += -ny * b.sx * 0.5; b.vy += nx * b.sx * 0.5; b.sx *= 0.5; }

    }

    if (!potted) for (const p of POCKETS) { const dx = b.x - p[0], dy = b.y - p[1]; if (dx * dx + dy * dy < p[2] * p[2]) { potted = true; break; } }
    if (potted) { b.on = false; b.vx = b.vy = 0; e.pots.push(b.n); }

}
function stillMoving(B) { for (const b of B) if (b.on && (b.vx || b.vy)) return true; return false; }
function maxSpeed(B) { let m = 0; for (const b of B) if (b.on) m = Math.max(m, Math.abs(b.vx) + Math.abs(b.vy)); return m; }
function advance(B, dt, e, rot) { // sub-step so nothing moves more than ~R/3 per step
  const n = Math.max(1, Math.ceil(maxSpeed(B) * dt / (R * 0.35))); for (let k = 0; k < n; k++) step(B, dt / n, e, rot);
}
const shotSpeed = p => 90 + Math.pow(p, 1.3) * (MAXV - 90);
function strike(B, a, p, sv_, sx) { const c = B[0], v = shotSpeed(p); c.vx = Math.cos(a) * v; c.vy = Math.sin(a) * v; c.sp = sv_ * v * 0.9; c.sx = sx * v * 0.18; }

// ================= rules =================
const isSolid = n => n >= 1 && n <= 7, isStripe = n => n >= 9;
function groupOf(n) { return isSolid(n) ? 'solid' : isStripe(n) ? 'stripe' : null; }
function own(p, n) { return groups[p] ? groupOf(n) === groups[p] : n !== 8 && n !== 0; }
function cleared(p, B) { B = B || balls; if (!groups[p]) return false; return !B.some(b => b.on && groupOf(b.n) === groups[p]); }
function judge(p, e, B, brk) { // returns {foul, win, lose, cont, assign}
  const clearedBefore = cleared(p, e.before || B);
  const scratch = e.pots.includes(0);
  let foul = scratch || e.first == null;
  if (!foul) { if (groups[p] == null) foul = e.first === 8 && !brk; else foul = clearedBefore ? e.first !== 8 : !own(p, e.first); }
  if (!foul && !brk && !e.pots.length && !e.rails2) { /* simple rule: no rail required */ }
  const r = { foul, scratch, win: false, lose: false, cont: false, assign: null };
  if (e.pots.includes(8)) { if (brk) { r.respot8 = true; } else if (clearedBefore && !foul) r.win = true; else r.lose = true; return r; }
  let g = groups[p];
  if (!g && !brk && !foul) { const first = e.pots.find(n => n !== 0 && n !== 8); if (first) { g = groupOf(first); r.assign = g; } }
  r.cont = !foul && e.pots.some(n => n !== 0 && n !== 8 && (g ? groupOf(n) === g : true));

}
function endShot() {
  const r = judge(turn, ev, balls, breakShot); const who = nameOf(turn), opp = 1 - turn;
  if (r.respot8) { const b = balls.find(b => b.n === 8); b.on = true; spot(b, W * 0.75, H / 2); }
  if (r.win || r.lose) { const winner = r.win ? turn : opp; finish(winner, r.win ? who + ' sank the 8-ball!' : (ev.pots.includes(0) ? who + ' scratched on the 8-ball.' : who + ' sank the 8-ball too early.')); return; }

    turn = opp; inHand = true; inHandBehind = false;
    const you = mode && turn === 0;
    setMsg((r.scratch ? 'Scratch! ' : ev.first == null ? 'Foul: no ball hit. ' : 'Foul: wrong ball hit first. ') + (you ? 'You have' : nameOf(turn) + ' has') + ' ball in hand.'); sfx('foul');
  } else if (r.cont) { const you = mode && turn === 0; setMsg((r.assign ? (you ? 'You are ' : nameOf(turn) + ' is ') + r.assign + 's. ' : 'Nice shot! ') + (you ? 'Shoot again.' : nameOf(turn) + ' shoots again.')); }
  else { turn = opp; setMsg(mode && turn === 0 ? 'Your turn.' : nameOf(turn) + "'s turn."); }

function spot(b, x, y) { b.x = x; b.y = y; for (let k = 0; k < 200; k++) { if (!balls.some(o => o !== b && o.on && Math.hypot(o.x - b.x, o.y - b.y) < 2 * R + 0.5)) return; b.x += R * 0.6; if (b.x > W - R) { b.x = W * 0.25; b.y += R * 2.2; } } }

  over = true; moving = false;
  if (mode) { if (winner === 0) wins.w++; else wins.l++; sv('pool_rec', wins); }
  document.getElementById('oh').textContent = mode ? (winner === 0 ? 'You win!' : 'Computer wins') : 'Player ' + (winner + 1) + ' wins!';

function ui() {
  for (let p = 0; p < 2; p++) {
    document.getElementById('p' + p).classList.toggle('on', turn === p && !over);
    document.getElementById('n' + p).textContent = mode ? (p === 0 ? 'You' : 'Computer') : 'Player ' + (p + 1);
    const g = groups[p]; document.getElementById('g' + p).textContent = g ? (g === 'solid' ? 'Solids (1–7)' : 'Stripes (9–15)') + (cleared(p) ? ' · on the 8' : '') : 'Open table';

      i.style.background = n > 8 ? 'linear-gradient(#fff 0 28%, rgb(' + c + ') 28% 72%, #fff 72%)' : 'rgb(' + c + ')'; if (n === 8) i.style.color = '#fff'; i.className = gone ? 'gone' : ''; tr.appendChild(i); }

// ================= aim helpers =================

}

  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return true; const ux = dx / L, uy = dy / L;

// ================= computer player =================
const POCKAIM = [[4, 4], [W / 2, -4], [W - 4, 4], [4, H - 4], [W / 2, H + 4], [W - 4, H - 4]];
function cloneB(B) { return B.map(b => ({ n: b.n, x: b.x, y: b.y, vx: 0, vy: 0, on: b.on, sp: 0, sx: 0 })); }
function candidates(B, p) {

  for (const b of tgt) for (let k = 0; k < 6; k++) {
    const [px, py] = POCKAIM[k], ox = px - b.x, oy = py - b.y, od = Math.hypot(ox, oy), ux = ox / od, uy = oy / od;
    const gx = b.x - ux * 2 * R, gy = b.y - uy * 2 * R, cx = gx - c.x, cy = gy - c.y, cd = Math.hypot(cx, cy); if (cd < 1) continue;
    const cut = Math.acos(Math.max(-1, Math.min(1, (cx * ux + cy * uy) / cd))); if (cut > 1.35) continue;

  const tone = (f, dur, type, vol, f2) => { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + dur); };
  if (k === 'click' && v > 0.02) { noise(0.03, 3200, 2, 0.5 * v); tone(2400, 0.03, 'sine', 0.12 * v); }
  if (k === 'thud' && v > 0.03) noise(0.08, 260, 1, 0.5 * v);
  if (k === 'cue') { noise(0.05, 1800, 1.5, 0.25 + 0.4 * v); tone(900, 0.04, 'triangle', 0.1); }
  if (k === 'pot') { noise(0.18, 180, 0.8, 0.5); tone(140, 0.2, 'sine', 0.25, 70); }
  if (k === 'foul') tone(220, 0.35, 'sawtooth', 0.06, 110);
  if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'triangle', 0.1), i * 120));
}

document.getElementById('newBtn').onclick = newGame;
document.getElementById('againBtn').onclick = newGame;
document.getElementById('mode').onchange = newGame;
window.addEventListener('resize', resize);
resize(); newGame(); requestAnimationFrame(loop);
window.__pool = { st: () => ({ balls: balls.map(b => [b.n, +b.x.toFixed(1), +b.y.toFixed(1), b.on]), turn, groups, moving, inHand, over, msg: msgT }), shoot, planCPU, setMode(m) { document.getElementById('mode').value = m; newGame(); }, place(x, y) { cue().x = x; cue().y = y; inHand = false; } };
