<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Bumper Blobs · Games Site</title>
<style>

  .slot .sw { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
  .slot b { flex: 1; } .slot small { color: var(--mut); font-size: 12px; display: block; font-weight: 500; }
  .slot select { background: #3a2222; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: 600 14px system-ui, sans-serif; }
  .btn { background: #ff8a3a; color: #2a0e00; border: 0; border-radius: 12px; padding: 12px 28px; font: 900 18px system-ui, sans-serif; cursor: pointer; box-shadow: 0 4px 0 #a84a10; } .btn.sec { background: #3a2222; color: var(--ink); box-shadow: none; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .help { color: var(--mut); font-size: 13px; margin-top: 10px; text-align: center; line-height: 1.8; } .help b { color: var(--ink); background: var(--panel); border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a href="index.html">← Games</a><h1>Bumper <span>Blobs</span></h1><button id="snd">🔊</button><button id="menuBtn">Menu</button></div>
  <div class="stage">
    <canvas id="c" width="1000" height="620"></canvas>
    <div class="ov on" id="setup"><div class="card">
      <h2>Bumper <span>Blobs</span></h2>
      <p>Ram the other blobs into the lava. Dash to hit hard. The platform shrinks! Win 3 rounds.</p>
      <div class="slots" id="slots"></div>
      <button class="btn" id="goBtn">START</button>
    </div></div>
    <div class="ov" id="win"><div class="card" id="winCard"></div></div>
  </div>
  <div class="help" id="help"></div>
</div>
<script>
const cv = document.getElementById('c'), cx = cv.getContext('2d'), W = 1000, H = 620, $ = id => document.getElementById(id);

$('snd').textContent = muted ? '🔇' : '🔊'; $('snd').onclick = () => { muted = !muted; ls.set('blob_mute', muted); $('snd').textContent = muted ? '🔇' : '🔊'; };

// ---------- setup ----------
function renderSlots() { const box = $('slots'); box.innerHTML = ''; let hum = 0;
  slots.forEach((s, i) => { const d = document.createElement('div'); d.className = 'slot'; const isH = s === 'human';
    d.innerHTML = '<div class="sw" style="background:' + SKINS[i].c + '"></div><b>' + SKINS[i].n + '<small>' + (isH ? 'Keys: ' + CONTROLS[i].txt : s === 'off' ? 'Not playing' : 'Computer') + '</small></b><select><option value="human">Player</option><option value="easy">CPU Easy</option><option value="medium">CPU Medium</option><option value="hard">CPU Hard</option>' + (i >= 2 ? '<option value="off">Off</option>' : '') + '</select>';
    const sel = d.querySelector('select'); sel.value = s; sel.onchange = () => { slots[i] = sel.value; renderSlots(); }; box.appendChild(d); if (isH) hum++; });
  $('help').innerHTML = slots.map((s, i) => s === 'human' ? '<span style="color:' + SKINS[i].c + ';font-weight:800">' + SKINS[i].n + '</span>: ' + CONTROLS[i].txt.replace(/(\w+)/g, '<b>$1</b>').replace(/<b>(Keys|Numpad)<\/b>/g, '$1') : '').filter(Boolean).join(' &nbsp;·&nbsp; ') + ' &nbsp;·&nbsp; <b>P</b> pause'; }
renderSlots();
$('goBtn').onclick = () => { if (slots.filter(s => s !== 'off').length < 2) return; ls.set('blob_slots', slots); newMatch(); };
$('menuBtn').onclick = () => { state = 'setup'; $('win').classList.remove('on'); $('setup').classList.add('on'); renderSlots(); };
function newMatch() { au(); blobs = slots.map((s, i) => s === 'off' ? null : { i, skin: SKINS[i], type: s, wins: 0 }).filter(Boolean); round = 0; $('setup').classList.remove('on'); $('win').classList.remove('on'); newRound(); }
function newRound() { round++; arenaR = R0; roundT = 0; ups = []; parts = []; rings = []; texts = []; upT = 4; cracks = [];
  blobs.forEach((b, k) => { const a = -Math.PI / 2 + k * Math.PI * 2 / blobs.length + Math.PI / 4; Object.assign(b, { x: CX + Math.cos(a) * 170, y: CY + Math.sin(a) * 170, vx: 0, vy: 0, alive: true, fall: 0, dashCd: 0, dashT: 0, pow: null, powT: 0, sq: 1, face: 'happy', faceT: 0, lastHit: null, ai: { t: 0, tx: CX, ty: CY } }); });
  state = 'count'; endT = 3; banner = 'ROUND ' + round; bannerT = 3; }

// ---------- input ----------
addEventListener('keydown', e => { keys[e.code] = true; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); if (e.code === 'KeyP' && (state === 'play' || state === 'pause')) { state = state === 'play' ? 'pause' : 'play'; } if (state === 'play') blobs.forEach(b => { if (b.type === 'human' && b.alive && CONTROLS[b.i].dash.includes(e.code)) dash(b); }); if (e.code === 'Enter' && $('win').classList.contains('on')) newMatch(); });
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- gameplay ----------
const radius = b => BR * (b.pow === 'big' ? 1.6 : 1), mass = b => (b.pow === 'big' ? 2.6 : 1) * (b.pow === 'heavy' ? 6 : 1) * (b.dashT > 0 ? 1.8 : 1);
function steer(b) { if (b.type === 'human') { const c = CONTROLS[b.i]; let x = (keys[c.rt] ? 1 : 0) - (keys[c.lf] ? 1 : 0), y = (keys[c.dn] ? 1 : 0) - (keys[c.up] ? 1 : 0), L = Math.hypot(x, y); return L ? [x / L, y / L] : [0, 0]; } return ai(b); }
function dash(b) { if (b.dashCd > 0 || !b.alive) return; let [x, y] = b.lastDir || [1, 0]; const sp = b.pow === 'speed' ? 700 : 570; b.vx += x * sp; b.vy += y * sp; b.dashT = .28; b.dashCd = b.pow === 'speed' ? .55 : 1.1; b.sq = 1.35; SFX.dash();
  for (let i = 0; i < 10; i++) parts.push({ x: b.x - x * 20, y: b.y - y * 20, vx: -x * 200 + (Math.random() - .5) * 120, vy: -y * 200 + (Math.random() - .5) * 120, l: .4, L: .4, c: b.skin.c, s: 4 + Math.random() * 4 });
  if (b.pow === 'boom') { b.pow = null; SFX.boom(); shake = 14; rings.push({ x: b.x, y: b.y, r: 10, max: 230, c: '#ffd23a' }); for (const o of blobs) if (o !== b && o.alive) { const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy) || 1; if (d < 230) { const k = (1 - d / 230) * 900 / mass(o) * (o.pow === 'heavy' ? 3 : 1); o.vx += dx / d * k; o.vy += dy / d * k; o.lastHit = b; o.face = 'ouch'; o.faceT = .6; } } } }
function ai(b) {
  const lvl = { easy: [.55, .5, 1.4, 90], medium: [.8, .25, .7, 50], hard: [1, .12, .35, 30] }[b.type], [speedK, err, think, edge] = lvl, A = b.ai;
  const dc = Math.hypot(b.x - CX, b.y - CY); if (dc > arenaR - edge - radius(b)) { const d = [(CX - b.x) / dc, (CY - b.y) / dc]; return [d[0] * speedK + (Math.random() - .5) * .2, d[1] * speedK]; } // too close to the edge: get back
  A.t -= 1 / 60; if (A.t <= 0 || !A.target || !A.target.alive) { A.t = think * (.6 + Math.random() * .8); const foes = blobs.filter(o => o !== b && o.alive); A.target = foes.reduce((best, o) => { const s = Math.hypot(o.x - CX, o.y - CY) * 1.2 - Math.hypot(o.x - b.x, o.y - b.y) + (o.type === 'human' ? 40 : 0); return !best || s > best.s ? { o, s } : best; }, null); A.target = A.target && A.target.o; A.err = [(Math.random() - .5) * err * 200, (Math.random() - .5) * err * 200]; }
  const up = ups.find(u => Math.hypot(u.x - b.x, u.y - b.y) < 220); if (up && b.type !== 'easy' && !b.pow) return norm(up.x - b.x, up.y - b.y, speedK);

  const oc = Math.hypot(t.x - CX, t.y - CY) || 1, ox = (t.x - CX) / oc, oy = (t.y - CY) / oc, px = t.x - ox * (radius(t) + radius(b) + 10) + A.err[0], py = t.y - oy * (radius(t) + radius(b) + 10) + A.err[1];
  const toP = Math.hypot(px - b.x, py - b.y), dir = toP > 30 ? norm(px - b.x, py - b.y, speedK) : norm(t.x - b.x, t.y - b.y, speedK);
  const dt = Math.hypot(t.x - b.x, t.y - b.y), along = ((t.x - b.x) * ox + (t.y - b.y) * oy) / (dt || 1);
  if (b.dashCd <= 0 && dt < 170 && along > (b.type === 'hard' ? .55 : .2) && Math.random() < (b.type === 'easy' ? .03 : .12)) { b.lastDir = norm(t.x - b.x, t.y - b.y, 1); dash(b); }
  return dir;
}
function norm(x, y, k) { const L = Math.hypot(x, y) || 1; return [x / L * k, y / L * k]; }

      const by = b.lastHit && b.lastHit.alive !== undefined ? b.lastHit : null; texts.push({ x: b.x, y: b.y - 30, t: by && by !== b ? by.skin.n + ' got ' + b.skin.n + '!' : b.skin.n + ' fell in!', c: '#fff', l: 1.6 }); } }

    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny; if (rv >= 0) continue; const e = 1.15, j2 = -(1 + e) * rv / (1 / ma + 1 / mb); a.vx -= j2 / ma * nx; a.vy -= j2 / ma * ny; b.vx += j2 / mb * nx; b.vy += j2 / mb * ny;

// ---------- drawing ----------
function drawBlob(b) { const r = radius(b), fallK = b.alive ? 1 : Math.max(0, 1 - b.fall * 1.8); if (fallK <= 0) return;
